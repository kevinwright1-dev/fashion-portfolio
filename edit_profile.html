<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <style>
        .avatar-preview {
            display: block;
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
        }

        .form-actions button {
            flex: 1;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">KLOZET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display: none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main>
        <h2 style="text-align: center; margin-bottom: 1rem;">Edit Profile</h2>
        <form id="profile-form">
            <img id="avatar-preview" class="avatar-preview" src="pics/default-avatar.jpg" alt="Avatar preview">

            <label for="avatar">Avatar (PNG, JPG, GIF or WebP, max 5 MB):</label>
            <input type="file" id="avatar" name="avatar" accept="image/gif, image/jpeg, image/png, image/webp">

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" pattern="[a-zA-Z0-9_]{3,30}" maxlength="30" required>
            <div class="username-hint" style="margin: -0.75rem 0 1rem;">3-30 characters, letters, numbers, and underscores only</div>

            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name" maxlength="100">

            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" rows="4" maxlength="200"></textarea>
            <div class="username-hint" id="bio-counter" style="margin: -0.75rem 0 1rem;">0/200 characters</div>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" maxlength="100" placeholder="City, State">

            <label for="website">Website:</label>
            <input type="url" id="website" name="website" maxlength="200" placeholder="https://yourwebsite.com">

            <p id="status" role="status"></p>
            <div class="form-actions">
                <button type="button" id="cancel-btn">Cancel</button>
                <button type="submit" id="submit-btn">Save Changes</button>
            </div>
        </form>
    </main>

    <script>
        const form = document.getElementById('profile-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusEl = document.getElementById('status');
        const avatarInput = document.getElementById('avatar');
        const avatarPreview = document.getElementById('avatar-preview');
        const bioInput = document.getElementById('bio');
        const bioCounter = document.getElementById('bio-counter');

        const MAX_SIZE = 5 * 1024 * 1024;
        const EXT_BY_TYPE = {
            'image/png': 'png',
            'image/jpeg': 'jpg',
            'image/gif': 'gif',
            'image/webp': 'webp'
        };

        let currentUser = null;
        let currentProfile = null;

        requireUser().then(async (user) => {
            if (!user) return;
            currentUser = user;
            await loadProfile();
        });

        async function loadProfile() {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error) {
                console.error('Error loading profile:', error);
                statusEl.textContent = 'There was an error loading your profile. Please refresh.';
                return;
            }

            currentProfile = data;
            document.getElementById('username').value = data.username || '';
            document.getElementById('full-name').value = data.full_name || '';
            bioInput.value = data.bio || '';
            document.getElementById('location').value = data.location || '';
            document.getElementById('website').value = data.website || '';
            avatarPreview.src = data.avatar_url || 'pics/default-avatar.jpg';
            updateBioCounter();
        }

        function updateBioCounter() {
            bioCounter.textContent = `${bioInput.value.length}/200 characters`;
        }
        bioInput.addEventListener('input', updateBioCounter);

        // Show the picked image right away; it is only uploaded on save.
        avatarInput.addEventListener('change', () => {
            const file = avatarInput.files[0];
            if (file && EXT_BY_TYPE[file.type]) {
                avatarPreview.src = URL.createObjectURL(file);
            }
        });

        document.getElementById('cancel-btn').addEventListener('click', () => {
            window.location.href = 'profile.html';
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!currentUser || !currentProfile) {
                statusEl.textContent = 'Loading your profile. Please try again in a moment.';
                return;
            }

            const avatarFile = avatarInput.files[0];
            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('full-name').value.trim();
            const bio = bioInput.value.trim();
            const location = document.getElementById('location').value.trim();
            const website = document.getElementById('website').value.trim();

            if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {
                statusEl.textContent = 'Username must be 3-30 characters: letters, numbers, and underscores only.';
                return;
            }

            // type="url" still accepts javascript: and data: links, so only allow http(s).
            if (website) {
                let parsed = null;
                try { parsed = new URL(website); } catch { /* not a URL */ }
                if (!parsed || !['http:', 'https:'].includes(parsed.protocol)) {
                    statusEl.textContent = 'Website must start with http:// or https://';
                    return;
                }
            }

            let ext = null;
            if (avatarFile) {
                ext = EXT_BY_TYPE[avatarFile.type];
                if (!ext) {
                    statusEl.textContent = 'Unsupported image type. Use PNG, JPEG, GIF, or WebP.';
                    return;
                }
                if (avatarFile.size > MAX_SIZE) {
                    statusEl.textContent = 'Image must be under 5 MB.';
                    return;
                }
            }

            submitBtn.disabled = true;
            statusEl.textContent = 'Saving...';

            try {
                if (username !== currentProfile.username) {
                    const { data: taken, error: takenError } = await supabaseClient
                        .from('profiles')
                        .select('id')
                        .eq('username', username)
                        .neq('id', currentUser.id)
                        .maybeSingle();
                    if (takenError) throw takenError;
                    if (taken) {
                        statusEl.textContent = 'That username is already taken.';
                        submitBtn.disabled = false;
                        return;
                    }
                }

                const updates = {
                    username,
                    full_name: fullName,
                    bio,
                    location,
                    website
                };

                if (avatarFile) {
                    const filePath = `${currentUser.id}/avatar_${Date.now()}.${ext}`;
                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('avatars')
                        .upload(filePath, avatarFile, {
                            upsert: false,
                            contentType: avatarFile.type
                        });
                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabaseClient.storage
                        .from('avatars')
                        .getPublicUrl(uploadData.path);
                    updates.avatar_url = urlData.publicUrl;
                }

                const { error: updateError } = await supabaseClient
                    .from('profiles')
                    .update(updates)
                    .eq('id', currentUser.id);
                if (updateError) throw updateError;

                window.location.href = 'profile.html';
            } catch (error) {
                console.error('Error updating profile:', error);
                statusEl.textContent = 'There was an error saving your profile. Please try again.';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
