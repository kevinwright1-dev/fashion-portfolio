<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <style>
        .profile-page {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header: avatar on the left, info on the right */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #222;
        }
        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            flex-shrink: 0;
        }
        .profile-info {
            flex: 1;
            min-width: 0;
        }
        .name-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .name-row h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 4px;
        }
        .edit-profile-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            display: inline-block;
        }
        .edit-profile-btn:hover {
            background: #222;
        }
        .log-in-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            font-size: 0.833333rem;
            line-height: normal;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            display: inline-block;
        }

        /* Stats sit inline under the name */
        .stats-row {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .stat-box {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }
        .stat-box h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 400;
        }
        .stat-box p {
            margin: 0;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #desc {
            margin: 0.8rem 0 0.3rem;
            font-size: 0.85rem;
            color: #999;
        }
        #member-since {
            margin: 0;
            font-size: 0.7rem;
            color: #666;
        }

        /* Section titles with a "view all" link on the right */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 2.5rem 0 1rem;
        }
        .section-header h2 {
            margin: 0;
            font-size: 0.85rem;
        }
        .section-header a {
            font-size: 0.75rem;
            color: #999;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .section-header a:hover {
            color: #fff;
        }
        /* Fixed column counts instead of the auto-fill from style.css */
        .gallery.outfits-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        .gallery.closet-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .gallery .card img {
            object-fit: contain;
        }

        /* Breakdowns: two boxes side by side */
        .breakdowns-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2.5rem;
        }
        .breakdowns-box {
            background: #111;
            border: 1px solid #222;
            padding: 1rem;
        }
        .breakdowns-box h2 {
            font-size: 0.75rem;
            margin-bottom: 1rem;
        }

        .breakdown-row {
            margin-bottom: 0.6rem;
        }
        .breakdown-label {
            margin: 0 0 0.2rem;
            font-size: 0.75rem;
            color: #999;
        }
        .breakdown-bar {
            height: 4px;
            background: #fff;
        }
        .brand-line {
            margin: 0;
            font-size: 0.8rem;
            color: #ccc;
            line-height: 2;
        }

        .featured-card {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 1.5rem;
            align-items: center;
            background: #111;
            border: 1px solid #222;
            padding: 1rem;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .featured-card:hover {
            border-color: #3a3a3a;
        }
        .featured-card img {
            width: 100%;
            height: 320px;
            object-fit: contain;
            display: block;
        }
        .featured-label {
            margin: 0;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .featured-title {
            margin: 0.3rem 0 0;
            font-size: 1.1rem;
        }
        .featured-desc {
            margin: 0.6rem 0 0;
            font-size: 0.8rem;
            color: #999;
        }
        .featured-votes {
            margin: 1rem 0 0;
            font-size: 0.9rem;
        }

        /* Phones: stack the header and shrink the grids */
        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .name-row,
            .stats-row {
                justify-content: center;
            }
            .gallery.outfits-grid,
            .gallery.closet-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">KLOZET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display: none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main class="profile-page" id="profile-content">
        <div class="profile-header">
            <img id="avatar" class="profile-avatar" src="" alt="Avatar">
            <div class="profile-info">
                <div class="name-row">
                    <h1 id="username">@username</h1>
                    <a href="edit_profile.html" class="edit-profile-btn">edit profile</a>
                </div>
                <div class="stats-row">
                    <div class="stat-box">
                        <h3 id="closet-count">0</h3>
                        <p>items</p>
                    </div>
                    <div class="stat-box">
                        <h3 id="outfit-count">0</h3>
                        <p>outfits</p>
                    </div>
                    <div class="stat-box">
                        <h3 id="forum-posts-count">0</h3>
                        <p>forum posts</p>
                    </div>
                </div>
                <p id="desc"></p>
                <p id="member-since">member since:</p>
            </div>
        </div>

        <div class="section-header">
            <h2>featured outfit</h2>
            <a>top upvoted</a>
        </div>
        <div id="featured-gallery"></div>

        <div class="section-header">
            <h2>recent outfits</h2>
            <a href="outfits.html">view all →</a>
        </div>
        <div class="gallery outfits-grid" id="recent-outfits-gallery"></div>

        <div class="section-header">
            <h2>recent klozet</h2>
            <a href="closet.html">view all →</a>
        </div>
        <div class="gallery closet-grid" id="recent-closet-gallery"></div>

        <div class="breakdowns-row">
            <div class="breakdowns-box">
                <h2>klozet breakdown</h2>
                <div id="category-breakdown"></div>
            </div>
            <div class="breakdowns-box">
                <h2>top brands</h2>
                <div id="top-brands"></div>
            </div>
        </div>
    </main>

    <div id="profile-login-prompt" style="text-align:center; padding: 4rem 2rem; color: #666" hidden>
        <p>Log in to see profile</p>
        <a href="auth.html?redirect=profile.html" class="log-in-btn">log in</a>
    </div>
</body>
<script>
    const usernameEl = document.getElementById("username");
    const avatarEl = document.getElementById("avatar");
    const descEl = document.getElementById("desc");
    const memberSinceEl = document.getElementById("member-since");
    const closetCountEl = document.getElementById("closet-count");
    const outfitCountEl = document.getElementById("outfit-count");
    const forumPostsCountEl = document.getElementById("forum-posts-count");
    let currentUser = null;


    async function loadProfile(){


        const { data: profile, error } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

        if (error) { console.error(error); return; }
        if (!profile) { usernameEl.textContent = 'profile not found'; return; }


        usernameEl.textContent = `@${profile.username}`;
        avatarEl.src = profile.avatar_url||'pics/default-avatar.jpg';
        descEl.textContent = profile.bio || 'no bio yet';
        memberSinceEl.textContent = `member since: ${new Date(profile.created_at).toLocaleDateString()}`;


    }

    function tally(items, field) {
        const counts = {};
        for (const item of items) {
            const value = (item[field] || '').trim().toLowerCase();
            if (!value) continue;
            counts[value] = (counts[value] || 0) + 1;
        }
        return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }
    
    async function countRows(table, column) {
        const { count, error } = await supabaseClient
            .from(table)
            .select('*', { count: 'exact', head: true })
            .eq(column, currentUser.id);

        if (error) {
            console.error(`count failed for ${table}:`, error);
            return 0;
        }
        return count ?? 0;
    }

    function makeCard(item, type) {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.src = item.img_url;
        img.alt = item.title;
        img.loading = 'lazy';

        const body = document.createElement('div');
        body.className = 'card-body';

        const header = document.createElement('div');
        header.className = 'card-header';

        const h3 = document.createElement('h3');
        h3.textContent = item.title;

        let meta;

        if (type === 'outfit') {
            meta = document.createElement('span');
            meta.className = 'card-author';
            meta.textContent = `▲ ${item.upvotes || 0}`;
        } else if (type === 'clothing_item') {
            meta = document.createElement('span');
            meta.className = 'card-author';
            meta.textContent = item.brand || 'no brand';
        }

        header.append(h3, ...(meta ? [meta] : []));
        body.append(header);
        card.append(img, body);
        return card;
    }

    async function loadStats() {
        const [itemCount, outfitCount, threadCount] = await Promise.all([
            countRows('clothing_items', 'user_id'),
            countRows('outfits', 'user_id'),
            countRows('threads', 'user_id')
        ]);

        closetCountEl.textContent = itemCount;
        outfitCountEl.textContent = outfitCount;
        forumPostsCountEl.textContent = threadCount;
    }

    async function loadFeatured() {
        const container = document.getElementById('featured-gallery');

        const { data: outfit, error } = await supabaseClient
            .from('outfits')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('upvotes', { ascending: false, nullsFirst: false })
            .limit(1)
            .maybeSingle();

        if (error) { console.error(error); return; }

        if (!outfit) {
            const empty = document.createElement('p');
            empty.className = 'empty-message';
            empty.textContent = 'no outfits yet — post one to feature it here';
            container.replaceChildren(empty);
            return;
        }

        const card = document.createElement('div');
        card.className = 'featured-card';

        const img = document.createElement('img');
        img.src = outfit.img_url;
        img.alt = outfit.title || 'featured outfit';

        const info = document.createElement('div');
        info.className = 'featured-info';

        const label = document.createElement('p');
        label.className = 'featured-label';
        label.textContent = 'outfit';

        const title = document.createElement('p');
        title.className = 'featured-title';
        title.textContent = outfit.title || 'untitled';

        info.append(label, title);

        if (outfit.description) {
            const desc = document.createElement('p');
            desc.className = 'featured-desc';
            desc.textContent = outfit.description;
            info.append(desc);
        }

        if (outfit.location) {
            const loc = document.createElement('p');
            loc.className = 'featured-desc';
            loc.textContent = outfit.location;
            info.append(loc);
        }

        const votes = document.createElement('p');
        votes.className = 'featured-votes';
        votes.textContent = `▲ ${outfit.upvotes || 0}`;
        info.append(votes);

        card.append(img, info);
        container.replaceChildren(card);
    }

    async function loadRecent() {
        const container = document.getElementById('recent-outfits-gallery');

        const { data: outfits, error } = await supabaseClient
            .from('outfits')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false})
            .limit(3);

        if (error) { console.error(error); return; }

        if (outfits.length === 0) {
            const empty = document.createElement('p');
            empty.textContent = 'no outfits yet';
            empty.style.color = '#666';
            container.replaceChildren(empty);
            return;
        }

        container.replaceChildren(...outfits.map((outfit) => makeCard(outfit, 'outfit')));
    }

    async function loadCloset() {
        const container = document.getElementById('recent-closet-gallery');

        const { data: items, error } = await supabaseClient
            .from('clothing_items')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false})
            .limit(3);

        if (error) { console.error(error); return; }

        if (items.length === 0) {
            const empty = document.createElement('p');
            empty.textContent = 'no clothing items yet';
            empty.style.color = '#666';
            container.replaceChildren(empty);
            return;
        }

        container.replaceChildren(...items.map((item) => makeCard(item, 'clothing_item')));
    }

    async function loadBreakdowns() {
        const breakdownEl = document.getElementById('category-breakdown');
        const brandsEl = document.getElementById('top-brands');

        const { data: items, error } = await supabaseClient
            .from('clothing_items')
            .select('category, brand')
            .eq('user_id', currentUser.id);

        if (error) { console.error(error); return; }

        if (items.length === 0) {
            breakdownEl.textContent = 'no items yet';
            brandsEl.textContent = 'no items yet';
            return;
        }

        const categories = tally(items, 'category');
        const biggest = categories[0][1];

        breakdownEl.replaceChildren(...categories.map(([name, count]) => {
            const row = document.createElement('div');
            row.className = 'breakdown-row';

            const label = document.createElement('p');
            label.className = 'breakdown-label';
            label.textContent = `${name} ${count}`;

            const bar = document.createElement('div');
            bar.className = 'breakdown-bar';
            bar.style.width = `${(count / biggest) * 100}%`;

            row.append(label, bar);
            return row;
        }));

        const brands = tally(items, 'brand').slice(0, 3);

        if (brands.length === 0) {
            brandsEl.textContent = 'no brands added';
            return;
        }

        brandsEl.replaceChildren(...brands.map(([name, count], i) => {
            const line = document.createElement('p');
            line.className = 'brand-line';
            line.textContent = `${String(i + 1).padStart(2, '0')} ${name}`;
            return line;
        }));
    }

    async function initProfile(){
        currentUser = await getSignedInUser();
        if(!currentUser){
            document.getElementById("profile-login-prompt").hidden = false;
            document.getElementById("profile-content").hidden = true;
            return;
        }
        await loadProfile();
        await loadStats();
        await loadFeatured();
        await loadRecent();
        await loadCloset();
        await loadBreakdowns();
    }
    initProfile();
</script>
</html>
