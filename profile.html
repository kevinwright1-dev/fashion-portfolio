<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <style>
        .profile-page {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header: avatar on the left, info on the right */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #222;
        }
        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            flex-shrink: 0;
        }
        .profile-info {
            flex: 1;
            min-width: 0;
        }
        .name-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .name-row h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 4px;
        }
        .edit-profile-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            display: inline-block;
        }
        .edit-profile-btn:hover {
            background: #222;
        }
        .log-in-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            font-size: 0.833333rem;
            line-height: normal;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            display: inline-block;
        }

        /* Stats sit inline under the name */
        .stats-row {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .stat-box {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }
        .stat-box h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 400;
        }
        .stat-box p {
            margin: 0;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #desc {
            margin: 0.8rem 0 0.3rem;
            font-size: 0.85rem;
            color: #999;
        }
        #member-since {
            margin: 0;
            font-size: 0.7rem;
            color: #666;
        }

        /* Section titles with a "view all" link on the right */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 2.5rem 0 1rem;
        }
        .section-header h2 {
            margin: 0;
            font-size: 0.85rem;
        }
        .section-header a {
            font-size: 0.75rem;
            color: #999;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .section-header a:hover {
            color: #fff;
        }

        /* Featured outfit: image left, details right */
        .featured-card {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 1.5rem;
            align-items: center;
            background: #111;
            border: 1px solid #222;
            padding: 1rem;
        }
        .featured-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        /* Fixed column counts instead of the auto-fill from style.css */
        .gallery.outfits-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        .gallery.closet-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
        }

        /* Breakdowns: two boxes side by side */
        .breakdowns-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2.5rem;
        }
        .breakdowns-box {
            background: #111;
            border: 1px solid #222;
            padding: 1rem;
        }
        .breakdowns-box h2 {
            font-size: 0.75rem;
            margin-bottom: 1rem;
        }

        /* Phones: stack the header and shrink the grids */
        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .name-row,
            .stats-row {
                justify-content: center;
            }
            .featured-card,
            .breakdowns-row {
                grid-template-columns: 1fr;
            }
            .gallery.outfits-grid,
            .gallery.closet-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">KLOZET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html">PROFILE</a>
        <a href="#" id="logout-btn" style="color: #ff6b6b;">LOGOUT</a>
    </nav>

    <main class="profile-page" id="profile-content">
        <div class="profile-header">
            <img id="avatar" class="profile-avatar" src="" alt="Avatar">
            <div class="profile-info">
                <div class="name-row">
                    <h1 id="username">@username</h1>
                    <a href="edit_profile.html" class="edit-profile-btn">edit profile</a>
                </div>
                <div class="stats-row">
                    <div class="stat-box">
                        <h3 id="closet-count">0</h3>
                        <p>items</p>
                    </div>
                    <div class="stat-box">
                        <h3 id="outfit-count">0</h3>
                        <p>outfits</p>
                    </div>
                    <div class="stat-box">
                        <h3 id="forum-posts-count">0</h3>
                        <p>forum posts</p>
                    </div>
                </div>
                <p id="desc"></p>
                <p id="member-since">member since:</p>
            </div>
        </div>

        <div class="section-header">
            <h2>featured outfit</h2>
            <a>top upvoted</a>
        </div>
        <div id="featured-gallery"></div>

        <div class="section-header">
            <h2>recent outfits</h2>
            <a href="outfits.html">view all →</a>
        </div>
        <div class="gallery outfits-grid" id="recent-outfits-gallery"></div>

        <div class="section-header">
            <h2>recent klozet</h2>
            <a href="closet.html">view all →</a>
        </div>
        <div class="gallery closet-grid" id="recent-closet-gallery"></div>

        <div class="breakdowns-row">
            <div class="breakdowns-box">
                <h2>klozet breakdown</h2>
                <div id="category-breakdown"></div>
            </div>
            <div class="breakdowns-box">
                <h2>top brands</h2>
                <div id="top-brands"></div>
            </div>
        </div>
    </main>

    <div id="profile-login-prompt" style="text-align:center; padding: 4rem 2rem; color: #666" hidden>
        <p>Log in to see profile</p>
        <a href="auth.html?redirect=profile.html" class="log-in-btn">log in</a>
    </div>
</body>
<script>
    const usernameEl = document.getElementById("username");
    const avatarEl = document.getElementById("avatar");
    const descEl = document.getElementById("desc");
    const memberSinceEl = document.getElementById("member-since");
    let currentUser = null;


    async function loadProfile(){


        const { data: profile, error } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

        if (error) { console.error(error); return; }
        if (!profile) { usernameEl.textContent = 'profile not found'; return; }


        usernameEl.textContent = `@${profile.username}`;
        avatarEl.src = profile.avatar_url||'pics/default-avatar.jpg';
        descEl.textContent = profile.bio || 'no bio yet';
        memberSinceEl.textContent = `member since: ${new Date(profile.created_at).toLocaleDateString()}`;


    }
    async function initProfile(){
        currentUser = await getSignedInUser();
        if(!currentUser){
            document.getElementById("profile-login-prompt").hidden = false;
            document.getElementById("profile-content").hidden = true;
            return;
        }
        await loadProfile();
    }
    initProfile();
</script>
</html>
