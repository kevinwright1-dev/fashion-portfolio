<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4"></script>
    <script src="config.js"></script>
    <style>


        /* ---------- Header ---------- */
        .inspo-section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .inspo-section-head h2 {
            margin: 0.3rem 0 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
        }

        /* ---------- Add form ---------- */
        #inspo-form {
            margin-bottom: 2rem;
        }

        #inspo-form label {
            display: block;
            margin-bottom: 0.3rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        #inspo-form input[type="text"],
        #inspo-form textarea {
            display: block;
            width: 100%;
            max-width: 480px;
            margin-bottom: 0.9rem;
        }

        #inspo-form input[type="file"] {
            display: block;
            margin-bottom: 0.9rem;
        }

        #inspo-form textarea {
            resize: vertical;
            min-height: 90px;
        }

        .inspo-form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        /* ---------- Masonry grid ---------- */
        .inspo-grid {
            column-width: 200px;
            column-gap: 1rem;
        }

        /* loading / empty / error messages span every column */
        .inspo-grid > .inspo-note {
            column-span: all;
        }

        /* ---------- Cards ---------- */
        .inspo-card {
            display: block;
            margin: 0 0 1rem;
            break-inside: avoid;
            overflow: hidden;
            cursor: pointer;
            background: rgba(17, 17, 17, 0.96);
            border: 1px solid #222;
            transition: border-color 0.2s ease;
        }

        .inspo-card:hover {
            border-color: #3a3a3a;
        }

        .inspo-card:focus-visible {
            border-color: #3a3a3a;
            outline: 1px solid #666;
            outline-offset: 2px;
        }

        .inspo-card img {
            display: block;
            width: 100%;
            height: auto;
            filter: grayscale(12%);
        }

        .inspo-card-body {
            padding: 0.75rem;
            display: grid;
            gap: 0.4rem;
        }

        .inspo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 0.75rem;
        }

        .inspo-card h3 {
            margin: 0;
            font-size: 0.95rem;
        }

        .inspo-card-cta {
            color: #666;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .inspo-note {
            margin: 0;
            color: #bcbcbc;
            font-size: 0.85rem;
        }

        /* ---------- Shared label style (modal) ---------- */
        .section-label,
        .meta-label {
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        .meta-label {
            display: block;
        }

        /* ---------- Modal ---------- */
        .inspo-modal-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.8fr);
            min-height: 0;
        }

        .inspo-modal-media {
            background: #050505;
        }

        .inspo-modal-media img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
        }

        .inspo-modal-copy {
            padding: 1.25rem;
            display: grid;
            align-content: start;
            gap: 1rem;
        }

        .inspo-modal-copy h3 {
            margin: 0;
            font-size: clamp(1.3rem, 2.2vw, 1.8rem);
            letter-spacing: 2px;
        }

        .inspo-modal-caption {
            display: grid;
            gap: 0.4rem;
            padding: 1rem 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .inspo-modal-caption span:not(.meta-label) {
            color: #fff;
            font-size: 1.1rem;
        }

        .inspo-modal-note {
            margin: 0;
            color: #d0d0d0;
            font-size: 1rem;
            line-height: 1.8;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 900px) {
            .inspo-modal-layout {
                grid-template-columns: 1fr;
            }

            .inspo-modal-media img {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="fits.html">FIT</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main>
        <div class="inspo-section-head">
            <h2>Inspo Board</h2>
            <button id="add-inspo-btn" aria-expanded="false" aria-controls="inspo-form">Add Inspo</button>
        </div>

        <div id="inspo-form" style="display: none;">
            <label for="inspo-author">Your name (optional)</label>
            <input type="text" id="inspo-author" maxlength="50">

            <label for="inspo-title">Title</label>
            <input type="text" id="inspo-title" maxlength="150">

            <label for="inspo-image">Image (PNG, JPG, GIF or WebP, max 5 MB)</label>
            <input type="file" id="inspo-image" accept="image/png, image/jpeg, image/gif, image/webp">

            <label for="inspo-desc">Description</label>
            <textarea id="inspo-desc" maxlength="200"></textarea>

            <p id="inspo-status" class="inspo-note" role="status"></p>

            <div class="inspo-form-actions">
                <button id="submit-inspo-btn">submit</button>
                <button id="cancel-inspo-btn">cancel</button>
            </div>
        </div>

        <div class="inspo-grid" id="inspo-grid">
            <!-- Inspo cards will be dynamically inserted here -->
        </div>

        <div id="inspo-modal" class="modal" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content" role="dialog" aria-modal="true" aria-label="Inspiration detail">
                <button class="modal-close" id="close-inspo-modal-btn" aria-label="Close inspiration detail">exit</button>
                <div id="inspo-modal-body"></div>
            </div>
        </div>
    </main>

    <script>
        const inspoGrid = document.getElementById('inspo-grid');
        const inspoModal = document.getElementById('inspo-modal');
        const inspoModalBody = document.getElementById('inspo-modal-body');
        const closeModalBtn = document.getElementById('close-inspo-modal-btn');
        const addBtn = document.getElementById('add-inspo-btn');
        const inspoForm = document.getElementById('inspo-form');
        const submitBtn = document.getElementById('submit-inspo-btn');
        const cancelBtn = document.getElementById('cancel-inspo-btn');
        const statusEl = document.getElementById('inspo-status');

        const inspoEntries = new Map();
        let lastFocusedCard = null;

        const MAX_SIZE = 5 * 1024 * 1024; // 5 MB
        const EXT_BY_TYPE = {
            'image/png': 'png',
            'image/jpeg': 'jpg',
            'image/gif': 'gif',
            'image/webp': 'webp'
        };

        // ---------- Grid ----------
        function showGridMessage(text) {
            inspoGrid.replaceChildren();
            const msg = document.createElement('p');
            msg.className = 'inspo-note';
            msg.textContent = text;
            inspoGrid.appendChild(msg);
        }

        function createInspoCard(entry) {
            const card = document.createElement('article');
            card.className = 'inspo-card';
            card.tabIndex = 0;
            card.dataset.id = entry.id;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Open ${entry.title}`);

            const img = document.createElement('img');
            img.alt = entry.title;
            img.loading = 'lazy';
            // Saved dimensions let the browser reserve space before the image loads
            if (entry.width && entry.height) {
                img.width = entry.width;
                img.height = entry.height;
            }
            // Drop the card if the image URL is broken
            img.addEventListener('error', () => {
                inspoEntries.delete(String(entry.id));
                card.remove();
            });
            img.src = entry.image_url;

            const body = document.createElement('div');
            body.className = 'inspo-card-body';

            const header = document.createElement('div');
            header.className = 'inspo-card-header';

            const title = document.createElement('h3');
            title.textContent = entry.title;

            const cta = document.createElement('span');
            cta.className = 'inspo-card-cta';
            cta.textContent = 'view';

            header.append(title, cta);

            const author = document.createElement('p');
            author.className = 'inspo-note';
            author.textContent = `by ${entry.author || 'anon'}`;

            body.append(header, author);
            card.append(img, body);

            return card;
        }

        async function loadInspoList() {
            showGridMessage('Loading...');

            const { data, error } = await supabaseClient
                .from('inspo_board')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching inspo entries:', error);
                showGridMessage('Error loading inspo. Try refreshing the page.');
                return;
            }

            inspoEntries.clear();
            inspoGrid.replaceChildren();

            if (data.length === 0) {
                showGridMessage('No inspo entries yet. Be the first to add one!');
                return;
            }

            const fragment = document.createDocumentFragment();
            data.forEach(entry => {
                inspoEntries.set(String(entry.id), entry);
                fragment.appendChild(createInspoCard(entry));
            });
            inspoGrid.appendChild(fragment);
        }

        // ---------- Modal ----------
        function openInspoModal(card) {
            const entry = inspoEntries.get(card.dataset.id);
            if (!entry) return;
            lastFocusedCard = card;

            const layout = document.createElement('div');
            layout.className = 'inspo-modal-layout';

            const media = document.createElement('div');
            media.className = 'inspo-modal-media';
            const img = document.createElement('img');
            img.src = entry.image_url;
            img.alt = entry.title;
            media.appendChild(img);

            const copy = document.createElement('div');
            copy.className = 'inspo-modal-copy';

            const label = document.createElement('span');
            label.className = 'section-label';
            label.textContent = 'Inspo';

            const h3 = document.createElement('h3');
            h3.textContent = entry.title;

            const caption = document.createElement('div');
            caption.className = 'inspo-modal-caption';

            const byLabel = document.createElement('span');
            byLabel.className = 'meta-label';
            byLabel.textContent = 'Posted by';
            const byValue = document.createElement('span');
            byValue.textContent = entry.author || 'anon';
            caption.append(byLabel, byValue);

            if (entry.description) {
                const descLabel = document.createElement('span');
                descLabel.className = 'meta-label';
                descLabel.textContent = 'Description';
                const descValue = document.createElement('p');
                descValue.className = 'inspo-modal-note';
                descValue.textContent = entry.description;
                caption.append(descLabel, descValue);
            }

            copy.append(label, h3, caption);
            layout.append(media, copy);
            inspoModalBody.replaceChildren(layout);

            inspoModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            closeModalBtn.focus();
        }

        function closeInspoModal() {
            inspoModal.style.display = 'none';
            inspoModalBody.replaceChildren();
            document.body.style.overflow = '';
            lastFocusedCard?.focus();
        }

        // ---------- Add form ----------
        function setFormOpen(open) {
            inspoForm.style.display = open ? 'block' : 'none';
            addBtn.setAttribute('aria-expanded', String(open));
        }

        function resetForm() {
            document.getElementById('inspo-author').value = '';
            document.getElementById('inspo-title').value = '';
            document.getElementById('inspo-image').value = '';
            document.getElementById('inspo-desc').value = '';
            statusEl.textContent = '';
        }

        async function getImageSize(file) {
            try {
                const bitmap = await createImageBitmap(file);
                const size = { width: bitmap.width, height: bitmap.height };
                bitmap.close();
                return size;
            } catch {
                return { width: null, height: null };
            }
        }

        addBtn.addEventListener('click', () => {
            setFormOpen(inspoForm.style.display === 'none');
        });

        cancelBtn.addEventListener('click', () => {
            setFormOpen(false);
        });

        submitBtn.addEventListener('click', async () => {
            const author = document.getElementById('inspo-author').value.trim();
            const title = document.getElementById('inspo-title').value.trim();
            const imageFile = document.getElementById('inspo-image').files[0];
            const desc = document.getElementById('inspo-desc').value.trim();

            if (!title || !imageFile) {
                statusEl.textContent = 'Please provide a title and an image.';
                return;
            }

            const ext = EXT_BY_TYPE[imageFile.type];
            if (!ext) {
                statusEl.textContent = 'Please choose a PNG, JPG, GIF, or WebP image.';
                return;
            }

            if (imageFile.size > MAX_SIZE) {
                statusEl.textContent = 'Image must be under 5 MB.';
                return;
            }

            submitBtn.disabled = true;
            statusEl.textContent = 'Uploading...';

            try {
                const { width, height } = await getImageSize(imageFile);
                const filePath = `public/${crypto.randomUUID()}.${ext}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('inspo_img')
                    .upload(filePath, imageFile, {
                        contentType: imageFile.type,
                        upsert: false
                    });
                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('inspo_img')
                    .getPublicUrl(uploadData.path);

                const { error: insertError } = await supabaseClient
                    .from('inspo_board')
                    .insert([{
                        author,
                        title,
                        image_url: urlData.publicUrl,
                        description: desc,
                        width,
                        height
                    }]);
                if (insertError) throw insertError;

                resetForm();
                setFormOpen(false);
                loadInspoList();
            } catch (err) {
                console.error('Error adding inspo:', err);
                statusEl.textContent = 'Something went wrong. Please try again.';
            } finally {
                submitBtn.disabled = false;
            }
        });

        // ---------- Events ----------
        closeModalBtn.addEventListener('click', closeInspoModal);
        document.querySelector('#inspo-modal .modal-backdrop').addEventListener('click', closeInspoModal);

        document.addEventListener('keydown', (event) => {
            if (inspoModal.style.display !== 'block') return;

            if (event.key === 'Escape') {
                closeInspoModal();
            } else if (event.key === 'Tab') {
                // Focus trap: the close button is the only focusable element in the modal
                event.preventDefault();
                closeModalBtn.focus();
            }
        });

        inspoGrid.addEventListener('click', (event) => {
            const card = event.target.closest('.inspo-card');
            if (card) {
                openInspoModal(card);
            }
        });

        loadInspoList();
    </script>
</body>
</html>
