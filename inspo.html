<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .inspo-shell {
            max-width: 1180px;
            margin: 0 auto;
        }

        /* ---------- Header ---------- */
        .inspo-section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .inspo-section-head h2 {
            margin: 0.3rem 0 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
        }

        /* ---------- Masonry grid ---------- */
        .inspo-grid {
            column-width: 200px;
            column-gap: 1rem;
        }

        /* loading / empty / error messages span every column */
        .inspo-grid > .inspo-note {
            column-span: all;
        }

        /* ---------- Cards ---------- */
        .inspo-card {
            display: block;
            margin: 0 0 1rem;
            break-inside: avoid;
            overflow: hidden;
            cursor: pointer;
            background: rgba(17, 17, 17, 0.96);
            border: 1px solid #222;
            transition: border-color 0.2s ease;
        }

        .inspo-card:hover {
            border-color: #3a3a3a;
        }

        .inspo-card:focus-visible {
            border-color: #3a3a3a;
            outline: 1px solid #666;
            outline-offset: 2px;
        }

        .inspo-card img {
            display: block;
            width: 100%;
            height: auto;
            filter: grayscale(12%);
        }

        .inspo-card-body {
            padding: 0.75rem;
            display: grid;
            gap: 0.4rem;
        }

        .inspo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 0.75rem;
        }

        .inspo-card h3 {
            margin: 0;
            font-size: 0.95rem;
        }

        .inspo-card-cta {
            color: #666;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .inspo-note {
            margin: 0;
            color: #bcbcbc;
            font-size: 0.85rem;
        }

        /* ---------- Shared label style (modal) ---------- */
        .section-label,
        .meta-label {
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        .meta-label {
            display: block;
        }

        /* ---------- Modal ---------- */
        .inspo-modal-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.8fr);
            min-height: 0;
        }

        .inspo-modal-media {
            background: #050505;
        }

        .inspo-modal-media img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
        }

        .inspo-modal-copy {
            padding: 1.25rem;
            display: grid;
            align-content: start;
            gap: 1rem;
        }

        .inspo-modal-copy h3 {
            margin: 0;
            font-size: clamp(1.3rem, 2.2vw, 1.8rem);
            letter-spacing: 2px;
        }

        .inspo-modal-caption {
            display: grid;
            gap: 0.4rem;
            padding: 1rem 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .inspo-modal-caption span:not(.meta-label) {
            color: #fff;
            font-size: 1.1rem;
        }

        .inspo-modal-note {
            margin: 0;
            color: #d0d0d0;
            font-size: 1rem;
            line-height: 1.8;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 900px) {
            .inspo-modal-layout {
                grid-template-columns: 1fr;
            }

            .inspo-modal-media img {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="fits.html">FIT</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main class="inspo-shell">
        <div class="inspo-section-head">
            <div>
                <h2>Inspo Board</h2>
            </div>
            <button id="add-inspo-btn">Add Inspo</button>
        </div>

        <div id="inspo-form" style ="display: none; margin-bottom: 1.5rem;">
            <input type="text" id="inspo-author" placeholder="your name(optional)" maxlength="50">
            <input type="text" id="inspo-title" placeholder="title" maxlength="150" required>
            <input type="file" id="inspo-image" accept="image/png, image/jpeg, image/gif, image/webp" required>
            <textarea id="inspo-desc" placeholder="description" maxlength="200"></textarea>
            <button id="submit-inspo-btn">submit</button>
            <button id="cancel-inspo-btn">cancel</button>
        </div>

        <div class="inspo-grid" id="inspo-grid">
            <!-- Inspo cards will be dynamically inserted here -->
        </div>

        <div id="inspo-modal" class="modal" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <button class="modal-close" id="close-inspo-modal-btn" aria-label="Close inspiration detail">exit</button>
                <div id="inspo-modal-body"></div>
            </div>
        </div>

            

    </main>


    <script>
        const inspoGrid = document.getElementById('inspo-grid');
        const inspoEntries = new Map();

        function showGridMessage(text) {
            inspoGrid.replaceChildren();
            const msg = document.createElement('p');
            msg.className = 'inspo-note';
            msg.textContent = text;
            inspoGrid.appendChild(msg);
        }
        function createInspoCard(entry) {
            const card = document.createElement('article');
            card.className = 'inspo-card';
            card.tabIndex = 0;
            card.dataset.id = entry.id;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Open ${entry.title}`);

            const img = document.createElement('img');
            img.src = entry.image_url;
            img.alt = entry.title;
            img.loading = 'lazy';

            const body = document.createElement('div');
            body.className = 'inspo-card-body';
            
            const header = document.createElement('div');
            header.className = 'inspo-card-header';
            

            const title = document.createElement('h3');
            title.textContent = entry.title;

            const cta = document.createElement('span');
            cta.className = 'inspo-card-cta';
            cta.textContent = 'view';

            header.append(title, cta);

            const author = document.createElement('p');
            author.className = 'inspo-note';
            author.textContent = `by ${entry.author || 'anon'}`;

            body.append(header, author);
            card.append(img, body);

            return card;
        }


        async function loadInspoList() {
            const { data, error } = await supabaseClient
                .from('inspo_board')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching inspo entries:', error);
                showGridMessage('Error loading inspo. ' + error.message);
                return;
            }

            inspoEntries.clear();
            inspoGrid.replaceChildren();

            if (data.length === 0) {
                showGridMessage('No inspo entries yet. Be the first to add one!');
                return;
            }

            const fragment = document.createDocumentFragment();
            data.forEach(entry => {
                inspoEntries.set(String(entry.id), entry);
                fragment.appendChild(createInspoCard(entry));
            });
            inspoGrid.appendChild(fragment);
        }

        let lastFocusedCard = null;
        function openInspoModal(card) {
            const entry = inspoEntries.get(card.dataset.id);
            if (!entry) return;
            lastFocusedCard = card;

            const layout = document.createElement('div');
            layout.className = 'inspo-modal-layout';

            const media = document.createElement('div');
            media.className = 'inspo-modal-media';
            const img = document.createElement('img');
            img.src = entry.image_url;
            img.alt = entry.title;
            media.appendChild(img);

            const copy = document.createElement('div');
            copy.className = 'inspo-modal-copy';

            const label = document.createElement('span');
            label.className = 'section-label';
            label.textContent = 'Inspo';

            const h3 = document.createElement('h3');
            h3.textContent = entry.title;

            const caption = document.createElement('div');
            caption.className = 'inspo-modal-caption';

            const byLabel = document.createElement('span');
            byLabel.className = 'meta-label';
            byLabel.textContent = 'Posted by';
            const byValue = document.createElement('span');
            byValue.textContent = entry.author || 'anon';
            caption.append(byLabel, byValue);

            if (entry.description) {
                const descLabel = document.createElement('span');
                descLabel.className = 'meta-label';
                descLabel.textContent = 'Description';
                const descValue = document.createElement('p');
                descValue.className = 'inspo-modal-note';
                descValue.textContent = entry.description;
                caption.append(descLabel, descValue);
            }

            copy.append(label, h3, caption);
            layout.append(media, copy);
            inspoModalBody.replaceChildren(layout);

            inspoModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            document.getElementById('close-inspo-modal-btn').focus();

        }

        function closeInspoModal() {
            inspoModal.style.display = 'none';
            inspoModalBody.replaceChildren();
            document.body.style.overflow = 'auto';
            lastFocusedCard?.focus();
        }
            
        

        document.getElementById('add-inspo-btn').addEventListener('click', () => {
            const inspoForm = document.getElementById('inspo-form');
            inspoForm.style.display = inspoForm.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('cancel-inspo-btn').addEventListener('click', () => {
            const inspoForm = document.getElementById('inspo-form');
            inspoForm.style.display = 'none';
        });
        document.getElementById('submit-inspo-btn').addEventListener('click', async () => {
            const author = document.getElementById('inspo-author').value;
            const title = document.getElementById('inspo-title').value;
            const imageFile = document.getElementById('inspo-image').files[0];
            const desc = document.getElementById('inspo-desc').value;

            if (!title || !imageFile) {
                alert('please provide a title and an image.');
                return;
            }

            const ext = imageFile.name.split('.').pop().toLowerCase();
            const filePath = `public/${crypto.randomUUID()}.${ext}`;
            
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('inspo_img')
                .upload(filePath, imageFile, {
                    contentType: imageFile.type,
                    upsert: false
                });

            if (uploadError) {
                console.error('Error uploading image:', uploadError);
                alert('Failed to upload image: ' + uploadError.message);
                return;
            }

            const { data: urlData} = supabaseClient.storage
                .from('inspo_img')
                .getPublicUrl(uploadData.path);

            
            const publicURL = urlData.publicUrl;

            const { error: insertError } = await supabaseClient.from('inspo_board').insert([
                { author, title, image_url: publicURL, description: desc }
            ]);

            if (insertError) {
                console.error('Error inserting inspo entry:', insertError);
                alert('Failed to add inspo: ' + insertError.message);
                return;
            }

            document.getElementById('inspo-author').value = '';
            document.getElementById('inspo-title').value = '';
            document.getElementById('inspo-image').value = '';
            document.getElementById('inspo-desc').value = '';
            document.getElementById('inspo-form').style.display = 'none';
            loadInspoList();

        });

        const authLink = document.getElementById('auth-link');
        const inspoModal = document.getElementById('inspo-modal');
        const inspoModalBody = document.getElementById('inspo-modal-body');




        document.getElementById('close-inspo-modal-btn').addEventListener('click', closeInspoModal);
        document.querySelector('#inspo-modal .modal-backdrop').addEventListener('click', closeInspoModal);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && inspoModal.style.display === 'block') {
                closeInspoModal();
            }
        });

        document.getElementById('inspo-grid').addEventListener('click', (event) => {
            const card = event.target.closest('.inspo-card');
            if (card) {
                openInspoModal(card);
            }
        });
        loadInspoList();
    </script>
</body>
</html>
