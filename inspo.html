<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .inspo-shell {
            max-width: 1180px;
            margin: 0 auto;
        }

        .inspo-hero {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) 320px;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .inspo-intro,
        .inspo-meta,
        .inspo-card {
            background: rgba(17, 17, 17, 0.96);
            border: 1px solid #222;
        }

        .inspo-intro {
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .inspo-intro::after {
            content: "";
            position: absolute;
            inset: auto -80px -80px auto;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
        }

        .inspo-kicker,
        .meta-label,
        .section-label,
        .inspo-tag {
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        .inspo-kicker {
            margin-bottom: 1rem;
            display: block;
        }

        .inspo-intro h1 {
            text-align: left;
            margin: 0 0 1rem 0;
            font-size: clamp(2.2rem, 5vw, 4rem);
            letter-spacing: 8px;
        }

        .inspo-intro p {
            margin: 0;
            max-width: 42rem;
            color: #aaa;
        }

        .inspo-meta {
            padding: 1.5rem;
            display: grid;
            gap: 1rem;
            align-content: start;
        }

        .meta-item {
            padding-bottom: 1rem;
            border-bottom: 1px solid #222;
        }

        .meta-item:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .meta-label {
            display: block;
            margin-bottom: 0.35rem;
        }

        .meta-value {
            display: block;
            color: #fff;
            font-size: 1.4rem;
        }

        .meta-copy {
            display: block;
            margin-top: 0.35rem;
            color: #888;
            font-size: 0.85rem;
        }

        .inspo-section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .inspo-section-head h2 {
            margin: 0.3rem 0 0 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
        }

        .inspo-section-copy {
            margin: 0;
            color: #777;
            font-size: 0.85rem;
            text-align: right;
        }

        .inspo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        .inspo-card {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .inspo-card:hover,
        .inspo-card:focus-visible {
            transform: translateY(-4px);
            border-color: #3a3a3a;
        }

        .inspo-card:focus-visible {
            outline: 1px solid #666;
            outline-offset: 2px;
        }

        .inspo-card img {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: contain;
            display: block;
            filter: grayscale(12%);
        }

        .inspo-card-body {
            padding: 1rem;
            display: grid;
            gap: 0.75rem;
        }

        .inspo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 1rem;
        }

        .inspo-card h3 {
            margin: 0;
            font-size: 1.05rem;
        }

        .inspo-note {
            margin: 0;
            color: #bcbcbc;
            font-size: 0.9rem;
        }

        .inspo-focus {
            margin: 0;
            color: #8a8a8a;
            font-size: 0.8rem;
            padding-top: 0.75rem;
            border-top: 1px solid #222;
        }

        .inspo-card-cta {
            color: #666;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .inspo-modal-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
            min-height: 640px;
        }

        .inspo-modal-media {
            background: #050505;
        }

        .inspo-modal-media img {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 2rem);
            object-fit: contain;
            display: block;
        }

        .inspo-modal-copy {
            padding: 2rem;
            display: grid;
            align-content: start;
            gap: 1rem;
        }

        .inspo-modal-copy h3 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.7rem);
            letter-spacing: 2px;
        }

        .inspo-modal-copy p {
            margin: 0;
        }

        .inspo-modal-note {
            color: #d0d0d0;
            font-size: 1rem;
            line-height: 1.8;
        }

        .inspo-modal-focus {
            color: #989898;
            padding-top: 1rem;
            border-top: 1px solid #222;
        }

        .inspo-modal-caption {
            display: grid;
            gap: 0.4rem;
            padding: 1rem 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .inspo-modal-caption span:last-child {
            color: #fff;
            font-size: 1.1rem;
        }

        @media (max-width: 900px) {
            .inspo-hero {
                grid-template-columns: 1fr;
            }

            .inspo-section-head {
                align-items: start;
                flex-direction: column;
            }

            .inspo-section-copy {
                text-align: left;
            }

            .inspo-modal-layout {
                grid-template-columns: 1fr;
            }

            .inspo-modal-media img {
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="fits.html">FIT</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main class="inspo-shell">
        <div class="inspo-section-head">
            <div>
                <h2>Inspo Board</h2>
            </div>
            <button id="add-inspo-btn">Add Inspo</button>
        </div>

        <div id="inspo-form" style ="display: none;">
            <input type="text" id="inspo-author" placeholder="your name(optional)" maxlength="50">
            <input type="text" id="inspo-title" placeholder="title" maxlength="150" required>
            <input type="file" id="inspo-image" accept="image/png, image/jpeg, image/gif, image/webp" required>
            <textarea id="inspo-desc" placeholder="description" maxlength="200"></textarea>
            <button id="submit-inspo-btn">submit</button>
            <button id="cancel-inspo-btn">cancel</button>
        </div>

        <div class="inspo-grid" id="inspo-grid">
            <!-- Inspo cards will be dynamically inserted here -->
        </div>

        <div id="inspo-modal" class="modal" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <button class="modal-close" id="close-inspo-modal-btn" aria-label="Close inspiration detail">exit</button>
                <div id="inspo-modal-body"></div>
                </div>
            </div>
        </div>

            

    </main>


    <script>
        document.getElementById('add-inspo-btn').addEventListener('click', () => {
            const inspoForm = document.getElementById('inspo-form');
            inspoForm.style.display = inspoForm.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('cancel-inspo-btn').addEventListener('click', () => {
            const inspoForm = document.getElementById('inspo-form');
            inspoForm.style.display = 'none';
        });
        document.getElementById('submit-inspo-btn').addEventListener('click', async () => {
            const author = document.getElementById('inspo-author').value;
            const title = document.getElementById('inspo-title').value;
            const imageFile = document.getElementById('inspo-image').files[0];
            const desc = document.getElementById('inspo-desc').value;

            if (!title || !imageFile) {
                alert('please provide a title and an image.');
                return;
            }

            const ext = imageFile.name.split('.').pop().toLowerCase();
            const filePath = `public/${crypto.randomUUID()}.${ext}`;
            
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('inspo_img')
                .upload(filePath, imageFile, {
                    content: imageFile.type,
                    upsert: false
                });

            if (uploadError) {
                console.error('Error uploading image:', uploadError);
                alert('Failed to upload image: ' + uploadError.message);
                return;
            }

            const { data: urlData} = supabaseClient.storage
                .from('inspo_img')
                .getPublicUrl(uploadData.path);

            
            const publicURL = urlData.publicUrl;

            const { error: insertError } = await supabaseClient.from('inspo_board').insert([
                { author, title, image_url: publicURL, description: desc }
            ]);

            if (insertError) {
                console.error('Error inserting inspo entry:', insertError);
                alert('Failed to add inspo: ' + insertError.message);
                return;
            }

            document.getElementById('inspo-author').value = '';
            document.getElementById('inspo-title').value = '';
            document.getElementById('inspo-image').value = '';
            document.getElementById('inspo-desc').value = '';
            document.getElementById('inspo-form').style.display = 'none';

        });

        const profileLink = document.getElementById('profile-link');
        const authLink = document.getElementById('auth-link');
        const inspoModal = document.getElementById('inspo-modal');
        const inspoModalBody = document.getElementById('inspo-modal-body');

        async function loadInspoList() {
            const { data, error } = await supabaseClient.from('inspo_board').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching inspo entries:', error);
                alert('Failed to load inspo board: ' + error.message);
                return;
            }

            const inspoGrid = document.getElementById('inspo-grid');
            inspoGrid.innerHTML = '';

            data.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'inspo-card';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="${entry.image_url}" alt="${entry.title}">
                    <div class="inspo-card-body">
                        <div class="inspo-card-header">
                            <h3>${entry.title}</h3>
                            <small>${entry.author || 'anon'}</small>
                        </div>
                        <span class="inspo-card-cta">view</span>
                    </div>
                `;
                inspoGrid.appendChild(card);
            });
        }

        document.querySelectorAll('.inspo-card').forEach((card) => {
            card.addEventListener('click', () => openInspoModal(card));
            card.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openInspoModal(card);
                }
            });
        });

        document.getElementById('close-inspo-modal-btn').addEventListener('click', closeInspoModal);
        document.querySelector('#inspo-modal .modal-backdrop').addEventListener('click', closeInspoModal);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && inspoModal.style.display === 'block') {
                closeInspoModal();
            }
        });

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                profileLink.style.display = 'inline';
                authLink.textContent = 'LOGOUT';
                authLink.href = '#';
                authLink.addEventListener('click', async (event) => {
                    event.preventDefault();
                    await supabaseClient.auth.signOut();
                    window.location.reload();
                });
            } else {
                profileLink.style.display = 'none';
                authLink.style.display = 'inline';
                authLink.textContent = 'LOGIN';
                authLink.href = 'auth.html';
            }
        });

        function openInspoModal(card) {
            const image = card.querySelector('img');
            const name = card.querySelector('h3')?.textContent || '';
            const tag = card.querySelector('.inspo-tag')?.textContent || '';
            const note = card.querySelector('.inspo-note')?.textContent || '';
            const focus = card.querySelector('.inspo-focus')?.textContent || '';

            inspoModalBody.innerHTML = `
                <div class="inspo-modal-layout">
                    <div class="inspo-modal-media">
                        <img src="${image.src}" alt="${image.alt}">
                    </div>
                    <div class="inspo-modal-copy">
                        <span class="section-label">Inspiration Detail</span>
                        <h3>${name}</h3>
                        <div class="inspo-modal-caption">
                            <span class="meta-label">Lane</span>
                            <span>${tag}</span>
                        </div>
                        <p class="inspo-modal-note">${note}</p>
                        <p class="inspo-modal-focus">${focus}</p>
                    </div>
                </div>
            `;

            inspoModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeInspoModal() {
            inspoModal.style.display = 'none';
            inspoModalBody.innerHTML = '';
            document.body.style.overflow = 'auto';
        }
        loadInspoList();
    </script>
</body>
</html>
