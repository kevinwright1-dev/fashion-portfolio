<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Outfit</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4"></script>
    <script src="config.js"></script>
    <style>
        #outfit-form input[type="file"],
        #outfit-form input[type="text"],
        #outfit-form textarea {
            display: block;
            margin-bottom: 0.9rem;
        }

        #outfit-form textarea {
            resize: vertical;
            min-height: 90px;
        }

        #status {
            min-height: 1.4em;
            color: #bcbcbc;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main>
        <h2 style="text-align: center; margin-bottom: 1rem">Create Outfit</h2>
        <form id="outfit-form">
            <label for="image">Photo (PNG, JPG, GIF or WebP, max 5 MB):</label>
            <input type="file" id="image" name="image" accept="image/gif, image/jpeg, image/png, image/webp" required>

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" maxlength="150" required>

            <label for="outfit-author">Your Name (Optional):</label>
            <input type="text" id="outfit-author" name="outfit-author" maxlength="50">

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" maxlength="100">

            <label for="description">Description:</label>
            <textarea id="description" name="description" maxlength="500"></textarea>

            <p id="status" role="status"></p>
            <button type="submit" id="submit-btn">Add Outfit</button>
        </form>
    </main>

    <script>
        const form = document.getElementById('outfit-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusEl = document.getElementById('status');

        const MAX_SIZE = 5 * 1024 * 1024; // 5 MB
        const EXT_BY_TYPE = {
            'image/png': 'png',
            'image/jpeg': 'jpg',
            'image/gif': 'gif',
            'image/webp': 'webp'
        };

        async function getImageSize(file) {
            try {
                const bitmap = await createImageBitmap(file);
                const size = { width: bitmap.width, height: bitmap.height };
                bitmap.close();
                return size;
            } catch {
                return { width: null, height: null };
            }
        }

        // Using the form's submit event lets the browser enforce `required` first
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const imageFile = document.getElementById('image').files[0];
            const title = document.getElementById('title').value.trim();
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            const author = document.getElementById('outfit-author').value.trim();

            if (!title || !imageFile) {
                statusEl.textContent = 'Please add a title and select an image.';
                return;
            }

            const ext = EXT_BY_TYPE[imageFile.type];
            if (!ext) {
                statusEl.textContent = 'Unsupported image type. Use PNG, JPEG, GIF, or WebP.';
                return;
            }

            if (imageFile.size > MAX_SIZE) {
                statusEl.textContent = 'Image must be under 5 MB.';
                return;
            }

            submitBtn.disabled = true;
            statusEl.textContent = 'Uploading...';

            try {
                const { width, height } = await getImageSize(imageFile);
                const filePath = `public/${crypto.randomUUID()}.${ext}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('outfit_img')
                    .upload(filePath, imageFile, {
                        upsert: false,
                        contentType: imageFile.type
                    });
                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('outfit_img')
                    .getPublicUrl(uploadData.path);

                const { error: insertError } = await supabaseClient.from('outfits').insert([{
                    title,
                    location,
                    description,
                    img_url: urlData.publicUrl,   
                    author_name: author,
                    width,
                    height
                }]);
                if (insertError) throw insertError;

                window.location.href = 'outfits.html';
            } catch (error) {
                console.error('Error adding outfit:', error);
                statusEl.textContent = 'There was an error adding the outfit. Please try again.';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
