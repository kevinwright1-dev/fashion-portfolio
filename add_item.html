<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Closet Item</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <style>
        /* Add item page: minimal single column with bordered sections.
           Overrides the global form/input/button rules from style.css. */
        .add-item-form {
            max-width: 600px;
            margin: 0 auto 3rem;
            padding: 0;
            background: transparent;
            border: 0;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .add-item-title {
            margin: 0 0 16px;
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-align: center;
        }

        .add-item-form .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* Photo drop zone */
        .photo-drop {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 260px;
            margin: 0;
            border: 1px dashed #333;
            color: #fff;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
        }

        .photo-drop:hover,
        .photo-drop.is-dragging {
            border-color: #888;
        }

        .photo-drop:focus-within {
            border-color: #fff;
        }

        .photo-drop-text {
            font-size: 14px;
        }

        .photo-drop-hint {
            font-size: 12px;
            color: #999;
        }

        .photo-drop img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0a0a;
        }

        .photo-drop.has-image .photo-drop-text,
        .photo-drop.has-image .photo-drop-hint,
        .photo-drop.has-image svg {
            visibility: hidden;
        }

        /* Bordered sections */
        .add-item-section {
            border: 1px solid #222;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .add-item-section-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .add-item-section h2 {
            margin: 0;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
        }

        .add-item-optional {
            font-size: 11px;
            color: #999;
        }

        /* Fields */
        .add-item-form .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 0;
            color: #fff;
        }

        .add-item-form .field-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
        }

        .add-item-form .field-row {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
        }

        .add-item-form .field-row > .field {
            flex: 1 1 180px;
        }

        .add-item-form .field-row > .field-wide {
            flex: 2 1 200px;
        }

        .add-item-form input[type="text"],
        .add-item-form input[type="number"],
        .add-item-form input[type="date"],
        .add-item-form textarea {
            box-sizing: border-box;
            width: 100%;
            height: 44px;
            margin: 0;
            padding: 0;
            background: transparent;
            border: 0;
            border-bottom: 1px solid #333;
            border-radius: 0;
            color: #fff;
            font-size: 16px;
        }

        .add-item-form input[type="date"] {
            color-scheme: dark;
        }

        .add-item-form textarea {
            height: auto;
            min-height: 88px;
            padding: 10px 0;
            resize: vertical;
            line-height: 1.6;
        }

        .add-item-form input::placeholder,
        .add-item-form textarea::placeholder {
            color: #5f5f5f;
        }

        .add-item-form input:focus-visible,
        .add-item-form textarea:focus-visible {
            outline: none;
            border-bottom-color: #fff;
        }

        .price-input {
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #333;
        }

        .price-input:focus-within {
            border-bottom-color: #fff;
        }

        .price-input span {
            color: #999;
            font-size: 16px;
        }

        .add-item-form .price-input input {
            flex: 1;
            min-width: 0;
            border-bottom: 0;
        }

        /* Category and color options */
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 20px;
        }

        .option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0;
            background: transparent;
            border: 0;
            border-bottom: 1px solid transparent;
            color: #999;
            font-size: 14px;
            letter-spacing: normal;
            text-transform: lowercase;
            cursor: pointer;
        }

        .option:hover {
            background: transparent;
            color: #fff;
        }

        .option[aria-pressed="true"] {
            color: #fff;
            border-bottom-color: #fff;
        }

        .option:focus-visible {
            outline: 1px solid #888;
            outline-offset: 2px;
        }

        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid #555;
        }

        /* Status + actions */
        .add-item-form #status {
            margin: 0;
            min-height: 1.6em;
            font-size: 13px;
            color: #ff6b6b;
            white-space: normal;
        }

        .add-item-form #status.is-info {
            color: #ccc;
        }

        .add-item-actions {
            display: flex;
            gap: 16px;
        }

        .add-item-actions button,
        .add-item-actions a {
            flex: 1 1 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 48px;
            padding: 0 16px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-family: "Roboto Mono", monospace;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-decoration: none;
            cursor: pointer;
        }

        .add-item-actions button:hover,
        .add-item-actions a:hover {
            background: #222;
        }

        .add-item-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">KLOZET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display: none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <main>
        <form id="closet-form" class="add-item-form" novalidate>
            <h1 class="add-item-title">Add item</h1>

            <label class="photo-drop" id="photo-drop">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
                <span class="photo-drop-text">add photo</span>
                <span class="photo-drop-hint">png, jpg, gif, webp · 5 MB</span>
                <input class="sr-only" type="file" id="image" name="image" accept="image/gif, image/jpeg, image/png, image/webp" required>
                <img id="photo-preview" alt="" hidden>
            </label>

            <section class="add-item-section" aria-labelledby="basics-heading">
                <h2 id="basics-heading">Basics</h2>

                <label class="field">
                    <span class="field-label">Title</span>
                    <input type="text" id="title" name="title" maxlength="150" placeholder="Washed black denim jacket" required>
                </label>

                <div class="option-group" role="group" aria-labelledby="category-label">
                    <span class="field-label" id="category-label">Category</span>
                    <div class="options" id="category-options">
                        <button type="button" class="option" data-value="tops" aria-pressed="false">Tops</button>
                        <button type="button" class="option" data-value="bottoms" aria-pressed="false">Bottoms</button>
                        <button type="button" class="option" data-value="outwear" aria-pressed="false">Outerwear</button>
                        <button type="button" class="option" data-value="shoes" aria-pressed="false">Shoes</button>
                        <button type="button" class="option" data-value="accessories" aria-pressed="false">Accessories</button>
                        <button type="button" class="option" data-value="other" aria-pressed="false">Other</button>
                    </div>
                </div>

                <div class="field-row">
                    <label class="field field-wide">
                        <span class="field-label">Brand</span>
                        <input type="text" id="brand" name="brand" maxlength="150" placeholder="Acne Studios" required>
                    </label>
                    <label class="field">
                        <span class="field-label">Size</span>
                        <input type="text" id="size" name="size" maxlength="150" placeholder="M" required>
                    </label>
                </div>
            </section>

            <section class="add-item-section" aria-labelledby="look-heading">
                <div class="add-item-section-head">
                    <h2 id="look-heading">Color &amp; material</h2>
                    <span class="add-item-optional">optional</span>
                </div>

                <div class="option-group" role="group" aria-labelledby="color-label">
                    <span class="field-label" id="color-label">Color</span>
                    <div class="options" id="color-options"></div>
                </div>

                <label class="field">
                    <span class="field-label">Material</span>
                    <input type="text" id="material" name="material" maxlength="150" placeholder="Cotton, 80% wool / 20% nylon…">
                </label>
            </section>

            <section class="add-item-section" aria-labelledby="purchase-heading">
                <div class="add-item-section-head">
                    <h2 id="purchase-heading">Purchase</h2>
                    <span class="add-item-optional">optional</span>
                </div>

                <label class="field">
                    <span class="field-label">Where bought</span>
                    <input type="text" id="where-bought" name="where_bought" maxlength="150" placeholder="Grailed, a thrift store, Uniqlo, a gift…">
                </label>

                <div class="field-row">
                    <label class="field">
                        <span class="field-label">Purchase date</span>
                        <input type="date" id="purchase-date" name="purchase_date">
                    </label>
                    <label class="field">
                        <span class="field-label">Price paid</span>
                        <span class="price-input">
                            <span aria-hidden="true">$</span>
                            <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00">
                        </span>
                    </label>
                </div>
            </section>

            <section class="add-item-section" aria-labelledby="notes-heading">
                <div class="add-item-section-head">
                    <h2 id="notes-heading">Notes</h2>
                    <span class="add-item-optional">optional</span>
                </div>
                <label class="field">
                    <span class="sr-only">Notes</span>
                    <textarea id="description" name="description" maxlength="500" placeholder="Fit, condition, how you style it…"></textarea>
                </label>
            </section>

            <p id="status" role="status"></p>

            <div class="add-item-actions">
                <button type="submit" id="submit-btn">add item</button>
                <a href="closet.html">cancel</a>
            </div>
        </form>
    </main>
    <script>
        const form = document.getElementById('closet-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusEl = document.getElementById('status');
        const imageInput = document.getElementById('image');
        const photoDrop = document.getElementById('photo-drop');
        const photoPreview = document.getElementById('photo-preview');

        let currentUser = null;
        requireUser().then((user) => { currentUser = user; });

        const MAX_SIZE = 5 * 1024 * 1024;
        const EXT_BY_TYPE = {
            'image/png': 'png',
            'image/jpeg': 'jpg',
            'image/gif': 'gif',
            'image/webp': 'webp'
        };

        const colorS = [
            ['Black', '#000000'], ['White', '#f5f5f5'], ['Grey', '#8a8a8a'], ['Navy', '#1d2b4f'],
            ['Blue', '#3b6fd1'], ['Green', '#2f7a4a'], ['Olive', '#6b6b2e'], ['Brown', '#6b4426'],
            ['Tan', '#c4a27a'], ['Cream', '#ede3cc'], ['Red', '#b8302f'], ['Pink', '#e59ab4'],
            ['Purple', '#6d4aa8'], ['Yellow', '#e6c440'], ['Orange', '#e07b2e'],
            ['Multi', 'conic-gradient(#d33, #e8c040, #3a9a5a, #2f6fd1, #9a4fc9, #d33)']
        ];

        function setStatus(message, isInfo = false) {
            statusEl.textContent = message;
            statusEl.classList.toggle('is-info', isInfo);
        }

        // Category: pick exactly one
        let selectedCategory = '';
        const categoryButtons = document.querySelectorAll('#category-options .option');
        categoryButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                selectedCategory = btn.dataset.value;
                categoryButtons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
            });
        });

        // colors: pick any number
        const colorOptions = document.getElementById('color-options');
        colorS.forEach(([name, swatch]) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option';
            btn.dataset.value = name.toLowerCase();
            btn.setAttribute('aria-pressed', 'false');

            const dot = document.createElement('span');
            dot.className = 'color-dot';
            dot.style.background = swatch;
            dot.setAttribute('aria-hidden', 'true');

            btn.append(dot, name);
            btn.addEventListener('click', () => {
                const on = btn.getAttribute('aria-pressed') === 'true';
                btn.setAttribute('aria-pressed', String(!on));
            });
            colorOptions.appendChild(btn);
        });

        function getSelectedColors() {
            return Array.from(colorOptions.querySelectorAll('.option[aria-pressed="true"]'))
                .map((btn) => btn.dataset.value);
        }

        // Photo preview + drag and drop
        let previewUrl = null;
        function showPreview(file) {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            if (!file || !EXT_BY_TYPE[file.type]) {
                previewUrl = null;
                photoPreview.hidden = true;
                photoDrop.classList.remove('has-image');
                return;
            }
            previewUrl = URL.createObjectURL(file);
            photoPreview.src = previewUrl;
            photoPreview.hidden = false;
            photoDrop.classList.add('has-image');
        }

        imageInput.addEventListener('change', () => showPreview(imageInput.files[0]));

        photoDrop.addEventListener('dragover', (event) => {
            event.preventDefault();
            photoDrop.classList.add('is-dragging');
        });
        photoDrop.addEventListener('dragleave', () => photoDrop.classList.remove('is-dragging'));
        photoDrop.addEventListener('drop', (event) => {
            event.preventDefault();
            photoDrop.classList.remove('is-dragging');
            const file = event.dataTransfer.files[0];
            if (!file) return;
            const transfer = new DataTransfer();
            transfer.items.add(file);
            imageInput.files = transfer.files;
            showPreview(file);
        });

        async function getImageSize(file) {
            try {
                const bitmap = await createImageBitmap(file);
                const size = { width: bitmap.width, height: bitmap.height };
                bitmap.close();
                return size;
            } catch {
                return { width: null, height: null };
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!currentUser) {
                setStatus('Checking your login. Please try again in a moment.', true);
                return;
            }

            const imageFile = imageInput.files[0];
            const title = document.getElementById('title').value.trim();
            const category = selectedCategory;
            const brand = document.getElementById('brand').value.trim();
            const size = document.getElementById('size').value.trim();
            const description = document.getElementById('description').value.trim();
            const colors = getSelectedColors();
            const material = document.getElementById('material').value.trim();
            const whereBought = document.getElementById('where-bought').value.trim();
            const purchaseDate = document.getElementById('purchase-date').value;
            const priceValue = document.getElementById('price').value;

            const missing = [];
            if (!imageFile) missing.push('a photo');
            if (!title) missing.push('a title');
            if (!category) missing.push('a category');
            if (!brand) missing.push('a brand');
            if (!size) missing.push('a size');
            if (missing.length) {
                setStatus(`Please add ${missing.join(', ')}.`);
                return;
            }

            const ext = EXT_BY_TYPE[imageFile.type];
            if (!ext) {
                setStatus('Unsupported image type. Use PNG, JPEG, GIF, or WebP.');
                return;
            }

            if (imageFile.size > MAX_SIZE) {
                setStatus('Image must be under 5 MB.');
                return;
            }

            submitBtn.disabled = true;
            setStatus('Uploading...', true);

            try {
                const { width, height } = await getImageSize(imageFile);
                const filePath = `public/${crypto.randomUUID()}.${ext}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('clothing_img')
                    .upload(filePath, imageFile, {
                        upsert: false,
                        contentType: imageFile.type
                    });
                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('clothing_img')
                    .getPublicUrl(uploadData.path);

                const { error: insertError } = await supabaseClient.from('clothing_items').insert([{
                    title,
                    category,
                    brand,
                    description,
                    img_url: urlData.publicUrl,
                    size,
                    price: priceValue === '' ? null : parseFloat(priceValue),
                    color: colors.length ? colors : null,
                    material: material || null,
                    where_bought: whereBought || null,
                    purchase_date: purchaseDate || null,
                    width,
                    height,
                    user_id: currentUser.id
                }]);
                if (insertError) throw insertError;

                window.location.href = 'closet.html';
            } catch (error) {
                console.error('Error adding item:', error);
                setStatus('There was an error adding the item. Please try again.');
                submitBtn.disabled = false;
            }
        });
    </script>


</body>
</html>
