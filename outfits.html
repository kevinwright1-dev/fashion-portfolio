<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfits</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .outfits-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .add-outfit-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            font-size: 0.833333rem;
            line-height: normal;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
        }

                
        .add-outfit-btn:hover {
            background: #222;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-state p {
            margin-bottom: 2rem;
        }
        #sort-controls {
            display: flex;
            gap: 1rem;
        }
        .outfits-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <div class="outfits-header">
        <h2>outfits</h2>
        
    </div>

    <div class="outfits-toolbar">
        <a href="add-outfit.html" class="add-outfit-btn" id="add-outfit-btn" style="display:block;">add outfit</a>

        <div id="sort-controls">
            <button data-sort="new">New</button>
            <button data-sort="old">Old</button>
            <button data-sort="top">Top</button>
        </div>
    </div>

    <p id="status" role="status" style="text-align: center; color: #666;"></p>

    <div class="gallery" id="outfits-gallery" style="display: none;">
        <!-- Outfits will be loaded here -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <p>No outfits yet</p>
        <a href="add-outfit.html" class="add-outfit-btn">Share Outfit</a>
    </div>
    <!-- Modal Overlay -->
    <div id="outfit-modal" class="modal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-label="Outfit details">
            <button class="modal-close" id="close-modal-btn" aria-label="Close outfit details">exit</button>
            
            <div id="modal-body">
                <p style="text-align: center; padding: 3rem; color: #666;">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        const outfitsGallery = document.getElementById('outfits-gallery');
        const emptyState = document.getElementById('empty-state');
        const outfitModal = document.getElementById('outfit-modal');
        const modalBody = document.getElementById('modal-body');
        const closeModalBtn = document.getElementById('close-modal-btn');

        const sortButtons = document.querySelectorAll('#sort-controls button');
        const outfits = new Map();
        let allOutfits = [];
        
        const statusEl = document.getElementById('status'); 

        async function loadOutfits() {
            outfitsGallery.style.display = 'none';
            emptyState.style.display = 'none';
            statusEl.textContent = 'Loading...';

            const { data, error } = await supabaseClient.from('outfits').select('*');

            if (error) {
                console.error('Error fetching outfits:', error);
                statusEl.textContent = 'Error loading outfits.';
                return;
            }

            statusEl.textContent = '';          // clear it before the empty check

            if (data.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            allOutfits = data;
            renderOutfits('new');
        }

        function renderOutfits(sortBy) {
            const sorted = [...allOutfits];
            if (sortBy === 'old') sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            else if (sortBy === 'top') sorted.sort((a, b) => (b.upvotes || 0) - (a.upvotes || 0));
            else sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            outfits.clear();
            const fragment = document.createDocumentFragment();

            sorted.forEach(outfit => {
                outfits.set(String(outfit.id), outfit);

                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = outfit.id;

                const img = document.createElement('img');
                img.src = outfit.img_url;
                img.alt = outfit.title;
                img.loading = 'lazy';

                const h3 = document.createElement('h3');
                h3.textContent = outfit.title;

                const body = document.createElement('div');
                body.className = 'card-body';

                const header = document.createElement('div');
                header.className = 'card-header';

                const cta = document.createElement('span');
                cta.className = 'card-cta';
                cta.textContent = 'view';

                const author = document.createElement('span');
                author.textContent = `by ${outfit.author_name || 'anon'}`;
                author.className = 'card-author';

                const upvoteButton = document.createElement('button');
                upvoteButton.type = 'button';
                upvoteButton.className = 'upvote';
                upvoteButton.dataset.outfitId = String(outfit.id);
                upvoteButton.textContent = `▲ ${outfit.upvotes || 0}`;

                header.append(h3, cta);
                body.append(header, author, upvoteButton);
                card.append(img, body);
                fragment.appendChild(card);
            });

            outfitsGallery.replaceChildren(fragment);
            outfitsGallery.style.display = 'grid';
        }

        let lastFocusedCard = null;

        function openModal(outfitId, card) {
            const outfit = outfits.get(outfitId);
            if (!outfit) return;

            lastFocusedCard = card;

            const layout = document.createElement('div');
            layout.className = 'modal-layout';

            const media = document.createElement('div');
            media.className = 'modal-media';
            const img = document.createElement('img');
            img.src = outfit.img_url;
            img.alt = outfit.title;
            media.appendChild(img);

            const copy = document.createElement('div');
            copy.className = 'modal-copy';

            const label = document.createElement('span');
            label.className = 'modal-label';
            label.textContent = 'Outfit';

            const title = document.createElement('h3');
            title.textContent = outfit.title;

            const caption = document.createElement('div');
            caption.className = 'modal-caption';

            const authorLabel = document.createElement('span');
            authorLabel.className = 'modal-meta-label';
            authorLabel.textContent = 'Posted by';
            const authorValue = document.createElement('span');
            authorValue.textContent = outfit.author_name || 'anon';
            caption.append(authorLabel, authorValue);

            if (outfit.location) {
                const locationLabel = document.createElement('span');
                locationLabel.className = 'modal-meta-label';
                locationLabel.textContent = 'Location';
                const locationValue = document.createElement('span');
                locationValue.textContent = outfit.location;
                caption.append(locationLabel, locationValue);
            }

            if (outfit.description) {
                const descriptionLabel = document.createElement('span');
                descriptionLabel.className = 'modal-meta-label';
                descriptionLabel.textContent = 'Description';
                const descriptionValue = document.createElement('p');
                descriptionValue.className = 'modal-description';
                descriptionValue.textContent = outfit.description;
                caption.append(descriptionLabel, descriptionValue);
            }

            const upvoteButton = document.createElement('button');
            upvoteButton.type = 'button';
            upvoteButton.className = 'upvote modal-upvote';
            upvoteButton.dataset.outfitId = String(outfit.id);
            upvoteButton.textContent = `▲ ${outfit.upvotes || 0}`;
            upvoteButton.addEventListener('click', () => addOutfitUpvote(outfit, upvoteButton));

            copy.append(label, title, caption, upvoteButton);
            layout.append(media, copy);
            modalBody.replaceChildren(layout);
            outfitModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function addOutfitUpvote(outfit, button) {
            const buttons = [...document.querySelectorAll('.upvote')]
                .filter(upvoteButton => upvoteButton.dataset.outfitId === String(outfit.id));
            buttons.forEach(upvoteButton => {
                upvoteButton.disabled = true;
            });

            try {
                const { data, error } = await supabaseClient
                    .rpc('add_upvote_outfit', { p_outfits_id: outfit.id });

                if (error) throw error;

                outfit.upvotes = data;
                buttons.forEach(upvoteButton => {
                    upvoteButton.textContent = `▲ ${outfit.upvotes}`;
                });
            } catch (error) {
                console.error('Error upvoting outfit:', error);
                alert(error.message || 'Unable to upvote this outfit.');
            } finally {
                buttons.forEach(upvoteButton => {
                    upvoteButton.disabled = false;
                });
                if (button.isConnected) button.focus();
            }
        }

        function closeModal() {
            outfitModal.style.display = 'none';
            modalBody.replaceChildren();
            document.body.style.overflow = '';
            lastFocusedCard?.focus();
        }

        closeModalBtn.addEventListener('click', closeModal);
        document.querySelector('#outfit-modal .modal-backdrop').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && outfitModal.style.display === 'block') closeModal();
        });

        sortButtons.forEach(button => {
            button.addEventListener('click', () => {
                renderOutfits(button.dataset.sort);
            });
        });

        outfitsGallery.addEventListener('click', (event) => {
            const upvoteButton = event.target.closest('.upvote');
            if (upvoteButton) {
                event.stopPropagation();
                const outfit = outfits.get(upvoteButton.dataset.outfitId);
                if (outfit) addOutfitUpvote(outfit, upvoteButton);
                return;
            }

            const card = event.target.closest('.card');
            if (card) openModal(card.dataset.id, card);
        });

        loadOutfits();

    </script>
</body>
</html>
