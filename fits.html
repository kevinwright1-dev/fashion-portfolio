<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfits</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .fits-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .add-outfit-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            font-size: 0.833333rem;
            line-height: normal;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            float: left;
        }

                
        .add-outfit-btn:hover {
            background: #222;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-state p {
            margin-bottom: 2rem;
        }
        #sort-controls {
            float: right;
            margin-left: 20px;
            margin-bottom: 20px;
        }

        #sort-controls button {
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="fits.html">FIT</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <div class="fits-header">
        <h2>outfits</h2>
        
    </div>

    <div>
        <a href="add-outfit.html" class="add-outfit-btn" id="add-outfit-btn" style="display:block;">add outfit</a>
    </div>

    <div id="sort-controls">
        <button data-sort="new">New</button>
        <button data-sort="old">Old</button>
        <button data-sort="top">Top</button>
    </div>

    <div class="gallery" id="outfits-gallery" style="display: none;">
        <!-- Outfits will be loaded here -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <p style="font-size: 3rem;">👔</p>
        <p>No fits yet</p>
        <a href="add-outfit.html" class="add-outfit-btn">Share Your First Fit</a>
    </div>
    <!-- Modal Overlay -->
    <div id="outfit-modal" class="modal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="close-modal-btn">exit</button>
            
            <div id="modal-body">
                <p style="text-align: center; padding: 3rem; color: #666;">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        const outfitsGallery = document.getElementById('outfits-gallery');
        const emptyState = document.getElementById('empty-state');
        const outfitModal = document.getElementById('outfit-modal');
        const modalBody = document.getElementById('modal-body');
        const closeModalBtn = document.getElementById('close-modal-btn');

        const sortButtons = document.querySelectorAll('#sort-controls button');
        const outfits = new Map();
        
        async function loadOutfits(sortBy = 'new') {
            outfitsGallery.style.display = 'none';
            emptyState.style.display = 'none';
            outfitsGallery.innerHTML = '<p style="text-align: center; padding: 3rem; color: #666;">Loading...</p>';

            let { data, error } = await supabase
                .from('outfits')
                .select('*');

            if (error) {
                console.error('Error fetching outfits:', error);
                outfitsGallery.innerHTML = '<p style="text-align: center; padding: 3rem; color: #666;">Error loading outfits.</p>';
                return;
            }

            if (data.length === 0) {
                outfitsGallery.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            if (sortBy === 'new') {
                data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            } else if (sortBy === 'old') {
                data.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            } else if (sortBy === 'top') {
                data.sort((a, b) => b.likes - a.likes);
            }

            outfits.clear();
            outfitsGallery.innerHTML = '';
            data.forEach(outfit => {
                outfits.set(outfit.id, outfit);
                const outfitCard = document.createElement('div');
                outfitCard.className = 'outfit-card';
                outfitCard.innerHTML = `
                    <img src="${outfit.image_url}" alt="${outfit.title}" style="width: 100%; height: auto;">
                    <h3>${outfit.title}</h3>
                    <p>${outfit.description}</p>
                    <button onclick="openModal(${outfit.id})">View Details</button>
                `;
                outfitsGallery.appendChild(outfitCard);
            });

            outfitsGallery.style.display = 'grid';
        }
        
        function openModal(outfitId) {
            const outfit = outfits.get(outfitId);
            if (outfit) {
                modalBody.innerHTML = `
                    <h2>${outfit.title}</h2>
                    <img src="${outfit.image_url}" alt="${outfit.title}" style="max-width: 100%; height: auto; margin-bottom: 1rem;">
                    <p>${outfit.description}</p>
                `;
                outfitModal.style.display = 'block';
            }
        }

    </script>
</body>
</html>
