<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klozet</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <style>
        /* Closet page. Overrides the global input/button/label rules from style.css. */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .add-item-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 44px;
            padding: 0 24px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-family: "Roboto Mono", monospace;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-decoration: none;
            cursor: pointer;
        }

        .add-item-btn:hover {
            background: #222;
        }

        .closet-main {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .closet-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
        }

        .closet-header h1 {
            margin: 0 0 4px;
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-align: left;
        }

        .closet-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 24px;
            font-size: 13px;
            color: #999;
        }

        /* Search / sort / filter box */
        .closet-controls {
            border: 1px solid #222;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .search-field {
            flex: 1 1 260px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            border-bottom: 1px solid #333;
        }

        .search-field:focus-within {
            border-bottom-color: #fff;
        }

        .search-field input {
            flex: 1;
            min-width: 0;
            width: auto;
            height: 44px;
            margin: 0;
            padding: 0;
            background: transparent;
            border: 0;
            color: #fff;
            font-size: 15px;
        }

        .search-field input::placeholder {
            color: #6a6a6a;
        }

        .search-field input:focus-visible {
            outline: none;
        }

        .sort-field {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }

        .field-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
        }

        .sort-field select {
            width: auto;
            height: 44px;
            margin: 0;
            padding: 0 12px;
            background: #000;
            color: #fff;
            border: 1px solid #333;
            font-size: 13px;
        }

        .box-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
            padding: 0 14px;
            box-sizing: border-box;
            background: #000;
            color: #999;
            border: 1px solid #333;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .box-btn:hover {
            background: #111;
            color: #fff;
        }

        .box-btn[aria-pressed="true"],
        .box-btn[aria-expanded="true"],
        .box-btn.is-active {
            color: #fff;
            border-color: #fff;
        }

        .view-toggle {
            display: flex;
        }

        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 22px;
            border-top: 1px solid #1a1a1a;
            padding-top: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            padding: 0;
            background: transparent;
            border: 0;
            border-bottom: 1px solid transparent;
            color: #999;
            font-size: 14px;
            letter-spacing: normal;
            text-transform: lowercase;
            cursor: pointer;
        }

        .chip:hover {
            background: transparent;
            color: #fff;
        }

        .chip[aria-pressed="true"] {
            color: #fff;
            border-bottom-color: #fff;
        }

        .chip-count {
            color: #777;
            font-size: 12px;
        }

        .chip:focus-visible,
        .box-btn:focus-visible,
        .link-btn:focus-visible,
        .list-open:focus-visible,
        .card:focus-visible {
            outline: 1px solid #888;
            outline-offset: 2px;
        }

        .filter-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top: 1px solid #1a1a1a;
            padding-top: 16px;
        }

        .filter-panel[hidden] {
            display: none;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
        }

        .filter-empty {
            font-size: 12px;
            color: #777;
        }

        .link-btn {
            padding: 0;
            min-height: 24px;
            background: transparent;
            border: 0;
            color: #999;
            font-size: 12px;
            letter-spacing: normal;
            text-transform: none;
            cursor: pointer;
        }

        .link-btn:hover {
            background: transparent;
            color: #fff;
        }

        .result-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            min-height: 32px;
            font-size: 12px;
            color: #999;
        }

        .result-bar .link-btn {
            color: #fff;
            text-decoration: underline;
        }

        /* Color dots */
        .dots {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid #555;
        }

        .dots-more {
            margin-left: 2px;
            font-size: 11px;
            color: #bbb;
        }

        /* Grid cards */
        .closet-main .gallery {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 0;
        }

        .card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .card-price {
            font-size: 12px;
            color: #ccc;
        }

        /* List view */
        .list-wrap {
            overflow-x: auto;
            border: 1px solid #222;
        }

        .list-wrap[hidden] {
            display: none;
        }

        .closet-table {
            width: 100%;
            min-width: 820px;
            border-collapse: collapse;
            font-size: 13px;
        }

        .closet-table th {
            padding: 12px 16px;
            border-bottom: 1px solid #222;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
            text-align: left;
        }

        .closet-table td {
            padding: 6px 16px;
            border-bottom: 1px solid #1a1a1a;
            color: #ccc;
        }

        .closet-table .num {
            text-align: right;
        }

        .list-open {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            padding: 0;
            background: transparent;
            border: 0;
            color: #fff;
            font-size: 13px;
            letter-spacing: normal;
            text-transform: none;
            text-align: left;
            cursor: pointer;
        }

        .list-open:hover {
            background: transparent;
            text-decoration: underline;
        }

        .list-thumb {
            width: 32px;
            height: 40px;
            flex-shrink: 0;
            object-fit: cover;
            background: #141414;
            border: 1px solid #222;
        }

        /* Empty states */
        .closet-empty {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }

        .closet-empty[hidden] {
            display: none;
        }

        .no-results {
            border: 1px dashed #333;
            padding: 48px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .no-results[hidden] {
            display: none;
        }

        /* Item popup */
        .modal-subline {
            margin: -0.5rem 0 0;
            color: #bbb;
            font-size: 0.9rem;
        }

        .modal-details {
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 20px;
            padding: 1rem 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .modal-details div {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .modal-details .full {
            grid-column: 1 / -1;
        }

        .modal-details dt {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
        }

        .modal-details dd {
            margin: 0;
            color: #fff;
            font-size: 0.95rem;
            overflow-wrap: anywhere;
        }

        .modal-details .dots {
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal-details .dots span:last-child {
            margin-left: 4px;
        }

        .modal-actions button {
            flex: 1 1 0;
            min-height: 44px;
        }

        .confirm-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            border: 1px solid #555;
        }

        .confirm-box p {
            margin: 0;
            font-size: 0.9rem;
            white-space: normal;
        }

        .confirm-delete {
            color: #ff8a8a;
            border-color: #ff8a8a;
        }

        .modal-edit-form input[type="date"] {
            color-scheme: dark;
        }

        .modal-edit-form .edit-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 0 16px;
        }

        .modal-edit-form .chip {
            min-height: 36px;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .modal-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html" aria-current="page">KLOZET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display: none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <div id="closet-login-prompt" class="closet-empty" hidden>
        <p>Log in to use klozet</p>
        <a href="auth.html?redirect=closet.html" class="add-item-btn">log in</a>
    </div>

    <main id="closet-page" class="closet-main" hidden>
        <header class="closet-header">
            <div>
                <h1>Klozet</h1>
                <div class="closet-summary">
                    <span id="summary-items"></span>
                    <span id="summary-value"></span>
                </div>
            </div>
            <a href="add_item.html" class="add-item-btn">add item</a>
        </header>

        <p id="status" role="status"></p>

        <div id="empty-state" class="closet-empty" hidden>
            <p>No items in klozet</p>
            <a href="add_item.html" class="add-item-btn">add item</a>
        </div>

        <div id="closet-content" hidden>
            <div style="display: flex; flex-direction: column; gap: 24px;">
                <section class="closet-controls" aria-label="Search and filter">
                    <div class="controls-row">
                        <label class="search-field">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
                            <span class="sr-only">Search your closet</span>
                            <input type="search" id="search" placeholder="search title or brand" autocomplete="off">
                        </label>

                        <label class="sort-field">
                            <span class="field-label">Sort</span>
                            <select id="sort">
                                <option value="newest">newest</option>
                                <option value="oldest">oldest</option>
                                <option value="price-high">price: high → low</option>
                                <option value="price-low">price: low → high</option>
                                <option value="brand">brand a → z</option>
                            </select>
                        </label>

                        <button type="button" class="box-btn" id="filters-btn" aria-expanded="false" aria-controls="filter-panel">filters</button>

                        <div class="view-toggle" role="group" aria-label="View">
                            <button type="button" class="box-btn" id="grid-btn" aria-pressed="true" aria-label="Grid view">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><rect x="14" y="14" width="6" height="6"></rect></svg>
                            </button>
                            <button type="button" class="box-btn" id="list-btn" aria-pressed="false" aria-label="List view">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="category-row" role="group" aria-label="Category" id="category-row">
                        <button type="button" class="chip" data-value="all" aria-pressed="true">All <span class="chip-count"></span></button>
                        <button type="button" class="chip" data-value="tops" aria-pressed="false">Tops <span class="chip-count"></span></button>
                        <button type="button" class="chip" data-value="bottoms" aria-pressed="false">Bottoms <span class="chip-count"></span></button>
                        <button type="button" class="chip" data-value="outwear" aria-pressed="false">Outerwear <span class="chip-count"></span></button>
                        <button type="button" class="chip" data-value="shoes" aria-pressed="false">Shoes <span class="chip-count"></span></button>
                        <button type="button" class="chip" data-value="accessories" aria-pressed="false">Accessories <span class="chip-count"></span></button>
                        <button type="button" class="chip" data-value="other" aria-pressed="false">Other <span class="chip-count"></span></button>
                    </div>

                    <div class="filter-panel" id="filter-panel" hidden>
                        <div class="filter-group">
                            <div class="filter-head">
                                <span class="field-label" id="color-filter-label">Color</span>
                                <button type="button" class="link-btn" id="clear-panel">clear filters</button>
                            </div>
                            <div class="filter-options" id="color-options" role="group" aria-labelledby="color-filter-label"></div>
                        </div>
                        <div class="filter-group">
                            <span class="field-label" id="material-filter-label">Material</span>
                            <div class="filter-options" id="material-options" role="group" aria-labelledby="material-filter-label"></div>
                        </div>
                        <div class="filter-group">
                            <span class="field-label" id="brand-filter-label">Brand</span>
                            <div class="filter-options" id="brand-options" role="group" aria-labelledby="brand-filter-label"></div>
                        </div>
                    </div>
                </section>

                <div class="result-bar">
                    <span id="result-text" role="status"></span>
                    <button type="button" class="link-btn" id="clear-all" hidden>clear all filters</button>
                </div>

                <div class="gallery" id="closet-gallery"></div>

                <div class="list-wrap" id="closet-list" hidden>
                    <table class="closet-table">
                        <thead>
                            <tr>
                                <th scope="col">Item</th>
                                <th scope="col">Brand</th>
                                <th scope="col">Category</th>
                                <th scope="col">Size</th>
                                <th scope="col">Color</th>
                                <th scope="col">Purchased</th>
                                <th scope="col" class="num">Price</th>
                            </tr>
                        </thead>
                        <tbody id="closet-list-body"></tbody>
                    </table>
                </div>

                <div class="no-results" id="no-results" hidden>
                    <span>Nothing matches those filters.</span>
                    <button type="button" class="add-item-btn" id="no-results-clear">clear filters</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="closet-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display: none;">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-content" id="modal-content">
            <button class="modal-close" id="close-modal-btn" aria-label="Close">exit</button>
            <div id="modal-body"></div>
        </div>
    </div>

<script>
    const closetPage = document.getElementById('closet-page');
    const closetContent = document.getElementById('closet-content');
    const closetGallery = document.getElementById('closet-gallery');
    const closetList = document.getElementById('closet-list');
    const listBody = document.getElementById('closet-list-body');
    const statusEl = document.getElementById('status');
    const emptyState = document.getElementById('empty-state');
    const noResults = document.getElementById('no-results');
    const resultText = document.getElementById('result-text');
    const clearAllBtn = document.getElementById('clear-all');
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort');
    const filtersBtn = document.getElementById('filters-btn');
    const filterPanel = document.getElementById('filter-panel');
    const gridBtn = document.getElementById('grid-btn');
    const listBtn = document.getElementById('list-btn');
    const categoryButtons = document.querySelectorAll('#category-row .chip');
    const closetModal = document.getElementById('closet-modal');
    const modalBody = document.getElementById('modal-body');
    const closeModalBtn = document.getElementById('close-modal-btn');

    const SWATCH = {
        black: '#000000', white: '#f5f5f5', grey: '#8a8a8a', navy: '#1d2b4f',
        blue: '#3b6fd1', green: '#2f7a4a', olive: '#6b6b2e', brown: '#6b4426',
        tan: '#c4a27a', cream: '#ede3cc', red: '#b8302f', pink: '#e59ab4',
        purple: '#6d4aa8', yellow: '#e6c440', orange: '#e07b2e',
        multi: 'conic-gradient(#d33, #e8c040, #3a9a5a, #2f6fd1, #9a4fc9, #d33)'
    };
    const COLOR_ORDER = Object.keys(SWATCH);
    const MAX_DOTS = 3;

    const CATEGORY_OPTIONS = [
        { value: 'tops', label: 'Tops' },
        { value: 'bottoms', label: 'Bottoms' },
        { value: 'outwear', label: 'Outerwear' },
        { value: 'shoes', label: 'Shoes' },
        { value: 'accessories', label: 'Accessories' },
        { value: 'other', label: 'Other' },
    ];
    const CATEGORY_LABEL = Object.fromEntries(CATEGORY_OPTIONS.map(({ value, label }) => [value, label]));

    // Everything the controls can change lives here; refresh() redraws from it.
    const view = {
        q: '',
        category: 'all',
        colors: new Set(),
        materials: new Set(),
        brands: new Set(),
        sort: 'newest',
        layout: localStorage.getItem('closet-layout') === 'list' ? 'list' : 'grid'
    };

    let allCloset = [];
    let currentUser = null;

    /* ---------- small helpers ---------- */

    function categoryOf(item) {
        return String(item.category || '').trim().toLowerCase();
    }

    function colorsOf(item) {
        if (Array.isArray(item.color)) return item.color.filter(Boolean).map((c) => String(c).toLowerCase());
        if (typeof item.color === 'string' && item.color.trim()) {
            return item.color.split(',').map((c) => c.trim().toLowerCase()).filter(Boolean);
        }
        return [];
    }

    function priceOf(item) {
        if (item.price === null || item.price === undefined || item.price === '') return null;
        const n = parseFloat(item.price);
        return Number.isFinite(n) ? n : null;
    }

    function money(n) {
        return '$' + n.toLocaleString('en-US', {
            minimumFractionDigits: n % 1 ? 2 : 0,
            maximumFractionDigits: 2
        });
    }

    function priceText(item) {
        const price = priceOf(item);
        if (price !== null) return money(price);
        if (/gift/i.test(item.where_bought || '')) return 'gift';
        return '';
    }

    function formatDate(iso) {
        if (!iso) return '';
        const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
        if (!y || !m || !d) return '';
        return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function makeDot(color) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = SWATCH[color] || '#555';
        dot.title = color;
        return dot;
    }

    // Up to MAX_DOTS dots, then "+N" for the rest.
    function makeDots(colors, max = MAX_DOTS) {
        const wrap = document.createElement('span');
        wrap.className = 'dots';
        colors.slice(0, max).forEach((c) => wrap.appendChild(makeDot(c)));
        if (colors.length > max) {
            const more = document.createElement('span');
            more.className = 'dots-more';
            const rest = colors.slice(max);
            more.textContent = `+${rest.length}`;
            more.title = `also ${rest.join(', ')}`;
            wrap.appendChild(more);
        }
        if (colors.length) wrap.setAttribute('aria-label', `colors: ${colors.join(', ')}`);
        return wrap;
    }

    function sortKeyAdded(item) {
        return String(item.created_at || item.purchase_date || '');
    }

    const SORTS = {
        'newest': (a, b) => sortKeyAdded(b).localeCompare(sortKeyAdded(a)) || String(b.id).localeCompare(String(a.id)),
        'oldest': (a, b) => sortKeyAdded(a).localeCompare(sortKeyAdded(b)) || String(a.id).localeCompare(String(b.id)),
        'price-high': (a, b) => (priceOf(b) ?? 0) - (priceOf(a) ?? 0),
        'price-low': (a, b) => (priceOf(a) ?? 0) - (priceOf(b) ?? 0),
        'brand': (a, b) => String(a.brand || '').localeCompare(String(b.brand || ''), undefined, { sensitivity: 'base' })
    };

    /* ---------- loading ---------- */

    async function loadCloset() {
        statusEl.textContent = 'loading';
        emptyState.hidden = true;
        closetContent.hidden = true;

        const { data, error } = await supabaseClient
            .from('clothing_items')
            .select('*')
            .eq('user_id', currentUser.id);

        if (error) {
            console.error(error);
            statusEl.textContent = 'Error loading closet';
            return;
        }

        statusEl.textContent = '';
        allCloset = data || [];
        afterDataChange();
    }

    // Call whenever allCloset changes (load, edit, delete).
    function afterDataChange() {
        updateSummary();
        if (!allCloset.length) {
            emptyState.hidden = false;
            closetContent.hidden = true;
            return;
        }
        emptyState.hidden = true;
        closetContent.hidden = false;
        buildFilterOptions();
        refresh();
    }

    function updateSummary() {
        const total = allCloset.reduce((sum, item) => sum + (priceOf(item) ?? 0), 0);
        document.getElementById('summary-items').textContent = `items: ${allCloset.length}`;
        document.getElementById('summary-value').textContent = `closet value: ${money(total)}`;
    }

    /* ---------- filter options (built from the closet itself) ---------- */

    function distinct(values) {
        const seen = new Map();
        values.forEach((v) => {
            const clean = String(v || '').trim();
            if (clean && !seen.has(clean.toLowerCase())) seen.set(clean.toLowerCase(), clean);
        });
        return [...seen.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    function buildFilterOptions() {
        const colors = [...new Set(allCloset.flatMap(colorsOf))].sort((a, b) => {
            const ia = COLOR_ORDER.indexOf(a), ib = COLOR_ORDER.indexOf(b);
            return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
        });
        const materials = distinct(allCloset.map((i) => i.material));
        const brands = distinct(allCloset.map((i) => i.brand));

        // Drop selections for values that no longer exist (e.g. after a delete).
        const keep = (set, values) => {
            const lower = new Set(values.map((v) => v.toLowerCase()));
            [...set].forEach((v) => { if (!lower.has(v)) set.delete(v); });
        };
        keep(view.colors, colors);
        keep(view.materials, materials);
        keep(view.brands, brands);

        renderOptions('color-options', colors, view.colors, true);
        renderOptions('material-options', materials, view.materials, false);
        renderOptions('brand-options', brands, view.brands, false);
    }

    function renderOptions(containerId, values, selected, withDot) {
        const container = document.getElementById(containerId);
        if (!values.length) {
            const none = document.createElement('span');
            none.className = 'filter-empty';
            none.textContent = 'none added yet';
            container.replaceChildren(none);
            return;
        }
        const buttons = values.map((value) => {
            const key = value.toLowerCase();
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chip';
            btn.setAttribute('aria-pressed', String(selected.has(key)));
            if (withDot) btn.appendChild(makeDot(key));
            btn.append(value);
            btn.addEventListener('click', () => {
                if (selected.has(key)) selected.delete(key); else selected.add(key);
                btn.setAttribute('aria-pressed', String(selected.has(key)));
                refresh();
            });
            return btn;
        });
        container.replaceChildren(...buttons);
    }

    /* ---------- filtering + drawing ---------- */

    function matchesSearchAndFilters(item) {
        if (view.q) {
            const haystack = `${item.title || ''} ${item.brand || ''}`.toLowerCase();
            if (!haystack.includes(view.q)) return false;
        }
        if (view.colors.size && !colorsOf(item).some((c) => view.colors.has(c))) return false;
        if (view.materials.size && !view.materials.has(String(item.material || '').trim().toLowerCase())) return false;
        if (view.brands.size && !view.brands.has(String(item.brand || '').trim().toLowerCase())) return false;
        return true;
    }

    function refresh() {
        const base = allCloset.filter(matchesSearchAndFilters);
        const shown = base
            .filter((item) => view.category === 'all' || categoryOf(item) === view.category)
            .sort(SORTS[view.sort]);

        // Category buttons: counts reflect search + filters, ignoring the category itself.
        categoryButtons.forEach((btn) => {
            const value = btn.dataset.value;
            const count = value === 'all' ? base.length : base.filter((i) => categoryOf(i) === value).length;
            btn.querySelector('.chip-count').textContent = count;
            btn.setAttribute('aria-pressed', String(value === view.category));
        });

        const activeFilters = view.colors.size + view.materials.size + view.brands.size;
        filtersBtn.textContent = activeFilters ? `filters (${activeFilters})` : 'filters';
        filtersBtn.classList.toggle('is-active', activeFilters > 0);

        const anyActive = !!view.q || view.category !== 'all' || activeFilters > 0;
        resultText.textContent = `Showing ${shown.length} of ${allCloset.length}`;
        clearAllBtn.hidden = !anyActive;

        gridBtn.setAttribute('aria-pressed', String(view.layout === 'grid'));
        listBtn.setAttribute('aria-pressed', String(view.layout === 'list'));

        noResults.hidden = shown.length > 0;
        closetGallery.style.display = shown.length && view.layout === 'grid' ? 'grid' : 'none';
        closetList.hidden = !(shown.length && view.layout === 'list');

        if (view.layout === 'grid') renderGrid(shown); else renderList(shown);
    }

    function renderGrid(items) {
        const fragment = document.createDocumentFragment();
        items.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = item.id;
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `${item.title}, view details`);

            const img = document.createElement('img');
            img.src = item.img_url;
            img.alt = '';
            img.loading = 'lazy';

            const body = document.createElement('div');
            body.className = 'card-body';

            const h3 = document.createElement('h3');
            h3.textContent = item.title;

            const meta = document.createElement('span');
            meta.className = 'card-author';
            meta.textContent = [item.brand, item.size].filter(Boolean).join(' · ');

            const foot = document.createElement('div');
            foot.className = 'card-foot';
            const price = document.createElement('span');
            price.className = 'card-price';
            price.textContent = priceText(item);
            foot.append(makeDots(colorsOf(item)), price);

            body.append(h3, meta, foot);
            card.append(img, body);
            fragment.appendChild(card);
        });
        closetGallery.replaceChildren(fragment);
    }

    function renderList(items) {
        const fragment = document.createDocumentFragment();
        items.forEach((item) => {
            const row = document.createElement('tr');

            const itemCell = document.createElement('td');
            const open = document.createElement('button');
            open.type = 'button';
            open.className = 'list-open';
            open.dataset.id = item.id;
            const thumb = document.createElement('img');
            thumb.className = 'list-thumb';
            thumb.src = item.img_url;
            thumb.alt = '';
            thumb.loading = 'lazy';
            open.append(thumb, item.title);
            itemCell.appendChild(open);

            const cell = (text, className) => {
                const td = document.createElement('td');
                td.textContent = text || '';
                if (className) td.className = className;
                return td;
            };

            const colorCell = document.createElement('td');
            colorCell.appendChild(makeDots(colorsOf(item)));

            row.append(
                itemCell,
                cell(item.brand),
                cell(CATEGORY_LABEL[categoryOf(item)] || item.category),
                cell(item.size),
                colorCell,
                cell(formatDate(item.purchase_date)),
                cell(priceText(item), 'num')
            );
            fragment.appendChild(row);
        });
        listBody.replaceChildren(fragment);
    }

    /* ---------- controls ---------- */

    searchInput.addEventListener('input', () => {
        view.q = searchInput.value.trim().toLowerCase();
        refresh();
    });

    sortSelect.addEventListener('change', () => {
        view.sort = sortSelect.value;
        refresh();
    });

    categoryButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
            view.category = btn.dataset.value;
            refresh();
        });
    });

    filtersBtn.addEventListener('click', () => {
        const open = filterPanel.hidden;
        filterPanel.hidden = !open;
        filtersBtn.setAttribute('aria-expanded', String(open));
    });

    function setLayout(layout) {
        view.layout = layout;
        localStorage.setItem('closet-layout', layout);
        refresh();
    }
    gridBtn.addEventListener('click', () => setLayout('grid'));
    listBtn.addEventListener('click', () => setLayout('list'));

    function clearPanelFilters() {
        view.colors.clear();
        view.materials.clear();
        view.brands.clear();
        buildFilterOptions();
    }

    function clearAll() {
        view.q = '';
        searchInput.value = '';
        view.category = 'all';
        clearPanelFilters();
        refresh();
    }

    document.getElementById('clear-panel').addEventListener('click', () => {
        clearPanelFilters();
        refresh();
    });
    clearAllBtn.addEventListener('click', clearAll);
    document.getElementById('no-results-clear').addEventListener('click', clearAll);

    // Open an item from a grid card or a list row.
    closetGallery.addEventListener('click', (event) => {
        const card = event.target.closest('.card');
        if (card) openModal(card.dataset.id, card);
    });
    closetGallery.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const card = event.target.closest('.card');
        if (!card) return;
        event.preventDefault();
        openModal(card.dataset.id, card);
    });
    listBody.addEventListener('click', (event) => {
        const btn = event.target.closest('.list-open');
        if (btn) openModal(btn.dataset.id, btn);
    });

    /* ---------- item popup ---------- */

    function makeColorPicker(selectedColors) {
        const wrap = document.createElement('div');
        wrap.className = 'edit-colors';
        wrap.setAttribute('role', 'group');
        wrap.setAttribute('aria-label', 'Color');
        COLOR_ORDER.forEach((color) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chip';
            btn.dataset.value = color;
            btn.setAttribute('aria-pressed', String(selectedColors.includes(color)));
            btn.append(makeDot(color), color);
            btn.addEventListener('click', () => {
                const on = btn.getAttribute('aria-pressed') === 'true';
                btn.setAttribute('aria-pressed', String(!on));
            });
            wrap.appendChild(btn);
        });
        return wrap;
    }

    function buildEditForm(item) {
        const form = document.createElement('form');
        form.className = 'modal-caption modal-edit-form';

        const addField = (labelText, control) => {
            const fieldLabel = document.createElement('label');
            fieldLabel.className = 'modal-meta-label';
            fieldLabel.textContent = labelText;
            fieldLabel.appendChild(control);
            form.appendChild(fieldLabel);
        };

        const makeInput = (name, value, { required = false, maxLength = 150, type = 'text' } = {}) => {
            const input = document.createElement('input');
            input.type = type;
            input.name = name;
            input.value = value ?? '';
            input.required = required;
            if (type === 'text') input.maxLength = maxLength;
            return input;
        };

        addField('Title', makeInput('title', item.title, { required: true }));

        const categorySelect = document.createElement('select');
        categorySelect.name = 'category';
        categorySelect.required = true;
        CATEGORY_OPTIONS.forEach(({ value, label }) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            categorySelect.appendChild(option);
        });
        categorySelect.value = categoryOf(item) || 'other';
        addField('Category', categorySelect);

        addField('Brand', makeInput('brand', item.brand, { required: true }));
        addField('Size', makeInput('size', item.size, { required: true }));

        // Color uses buttons, so it isn't part of FormData; read it on save.
        const colorGroup = document.createElement('div');
        colorGroup.className = 'modal-meta-label';
        colorGroup.textContent = 'Color';
        const picker = makeColorPicker(colorsOf(item));
        colorGroup.appendChild(picker);
        form.appendChild(colorGroup);

        addField('Material', makeInput('material', item.material));
        addField('Where bought', makeInput('where_bought', item.where_bought));
        addField('Purchase date', makeInput('purchase_date', item.purchase_date ? String(item.purchase_date).slice(0, 10) : '', { type: 'date' }));

        const priceInput = makeInput('price', priceOf(item) ?? '', { type: 'number' });
        priceInput.min = '0';
        priceInput.step = '0.01';
        addField('Price paid', priceInput);

        const description = document.createElement('textarea');
        description.name = 'description';
        description.maxLength = 500;
        description.value = item.description || '';
        addField('Description', description);

        form.getSelectedColors = () =>
            [...picker.querySelectorAll('.chip[aria-pressed="true"]')].map((b) => b.dataset.value);

        return form;
    }

    function addDetail(list, label, content, { full = false } = {}) {
        if (content === null || content === undefined || content === '') return;
        const row = document.createElement('div');
        if (full) row.className = 'full';
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        if (content instanceof Node) dd.appendChild(content); else dd.textContent = content;
        row.append(dt, dd);
        list.appendChild(row);
    }

    let lastFocused = null;

    function openModal(closetId, trigger) {
        const item = allCloset.find((i) => String(i.id) === String(closetId));
        if (!item) return;
        if (trigger) lastFocused = trigger;

        const layout = document.createElement('div');
        layout.className = 'modal-layout';

        const media = document.createElement('div');
        media.className = 'modal-media';
        const img = document.createElement('img');
        img.src = item.img_url;
        img.alt = item.title;
        media.appendChild(img);

        const copy = document.createElement('div');
        copy.className = 'modal-copy';

        const label = document.createElement('span');
        label.className = 'modal-label';
        label.textContent = CATEGORY_LABEL[categoryOf(item)] || 'Clothing item';

        const title = document.createElement('h3');
        title.id = 'modal-title';
        title.textContent = item.title;

        const subline = document.createElement('p');
        subline.className = 'modal-subline';
        subline.textContent = [item.brand, item.size ? `size ${item.size}` : ''].filter(Boolean).join(' · ');

        const details = document.createElement('dl');
        details.className = 'modal-details';

        const colors = colorsOf(item);
        if (colors.length) {
            const colorValue = document.createElement('span');
            colorValue.className = 'dots';
            colors.forEach((c) => colorValue.appendChild(makeDot(c)));
            const colorNames = document.createElement('span');
            colorNames.textContent = colors.join(', ');
            colorValue.appendChild(colorNames);
            addDetail(details, 'Color', colorValue, { full: true });
        }
        addDetail(details, 'Material', item.material);
        addDetail(details, 'Where bought', item.where_bought);
        addDetail(details, 'Purchased', formatDate(item.purchase_date));
        addDetail(details, 'Price paid', priceText(item));
        addDetail(details, 'Description', item.description, { full: true });

        const editError = document.createElement('p');
        editError.className = 'modal-error';
        editError.setAttribute('role', 'alert');

        const actions = document.createElement('div');
        actions.className = 'modal-actions';

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'modal-edit';
        editButton.textContent = 'Edit';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'modal-delete';
        deleteButton.textContent = 'Delete';

        const saveButton = document.createElement('button');
        saveButton.type = 'button';
        saveButton.className = 'modal-save';
        saveButton.textContent = 'Save';

        const cancelButton = document.createElement('button');
        cancelButton.type = 'button';
        cancelButton.className = 'modal-cancel';
        cancelButton.textContent = 'Cancel';
        cancelButton.addEventListener('click', () => openModal(item.id));

        actions.append(editButton, deleteButton);

        /* edit */
        let editForm = null;
        editButton.addEventListener('click', () => {
            editForm = buildEditForm(item);
            editForm.addEventListener('submit', (event) => {
                event.preventDefault();
                saveEdit();
            });
            subline.remove();
            details.replaceWith(editForm);
            label.textContent = 'Editing item';
            actions.replaceChildren(saveButton, cancelButton);
            editForm.querySelector('input[name="title"]').focus();
        });
        saveButton.addEventListener('click', () => saveEdit());

        async function saveEdit() {
            if (saveButton.disabled || !editForm) return;
            if (!editForm.reportValidity()) return;

            const values = Object.fromEntries(new FormData(editForm));
            const selectedColors = editForm.getSelectedColors();
            const updates = {
                title: values.title.trim(),
                category: values.category,
                brand: values.brand.trim(),
                size: values.size.trim(),
                description: values.description.trim(),
                color: selectedColors.length ? selectedColors : null,
                material: values.material.trim() || null,
                where_bought: values.where_bought.trim() || null,
                purchase_date: values.purchase_date || null,
                price: values.price === '' ? null : parseFloat(values.price)
            };

            if (!updates.title || !updates.brand || !updates.size) {
                editError.textContent = 'Title, brand and size cannot be blank.';
                return;
            }

            saveButton.disabled = true;
            cancelButton.disabled = true;
            saveButton.textContent = 'Saving...';
            editError.textContent = '';

            const { data, error } = await supabaseClient
                .from('clothing_items')
                .update(updates)
                .eq('id', item.id)
                .eq('user_id', currentUser.id)
                .select()
                .single();

            if (error) {
                console.error('Error updating item:', error);
                editError.textContent = 'There was an error saving your changes. Please try again.';
                saveButton.disabled = false;
                cancelButton.disabled = false;
                saveButton.textContent = 'Save';
                return;
            }

            Object.assign(item, data);
            afterDataChange();
            openModal(item.id);
        }

        /* delete */
        deleteButton.addEventListener('click', () => {
            const box = document.createElement('div');
            box.className = 'confirm-box';
            const question = document.createElement('p');
            question.textContent = 'Delete this item? This can’t be undone.';
            const row = document.createElement('div');
            row.className = 'modal-actions';

            const yes = document.createElement('button');
            yes.type = 'button';
            yes.className = 'confirm-delete';
            yes.textContent = 'Yes, delete';

            const keep = document.createElement('button');
            keep.type = 'button';
            keep.textContent = 'Keep it';
            keep.addEventListener('click', () => {
                box.replaceWith(actions);
                deleteButton.focus();
            });

            yes.addEventListener('click', async () => {
                yes.disabled = true;
                keep.disabled = true;
                yes.textContent = 'Deleting...';
                editError.textContent = '';

                const { data, error } = await supabaseClient
                    .from('clothing_items')
                    .delete()
                    .eq('id', item.id)
                    .eq('user_id', currentUser.id)
                    .select();

                if (error || !data || !data.length) {
                    console.error('Error deleting item:', error);
                    editError.textContent = 'There was an error deleting this item. Please try again.';
                    yes.disabled = false;
                    keep.disabled = false;
                    yes.textContent = 'Yes, delete';
                    return;
                }

                await removeImage(item.img_url);
                allCloset = allCloset.filter((i) => String(i.id) !== String(item.id));
                lastFocused = null;
                closeModal();
                afterDataChange();
            });

            row.append(yes, keep);
            box.append(question, row);
            actions.replaceWith(box);
            keep.focus();
        });

        copy.append(label, title, subline, details, editError, actions);
        layout.append(media, copy);
        modalBody.replaceChildren(layout);
        closetModal.style.display = 'block';
        document.body.style.overflow = 'hidden';
        closeModalBtn.focus();
    }

    // Best effort: remove the photo from storage once its row is gone.
    async function removeImage(imgUrl) {
        const marker = '/clothing_img/';
        const index = String(imgUrl || '').indexOf(marker);
        if (index < 0) return;
        const path = decodeURIComponent(imgUrl.slice(index + marker.length).split('?')[0]);
        const { error } = await supabaseClient.storage.from('clothing_img').remove([path]);
        if (error) console.warn('Item deleted, but its photo could not be removed:', error);
    }

    function closeModal() {
        closetModal.style.display = 'none';
        modalBody.replaceChildren();
        document.body.style.overflow = '';
        if (lastFocused && document.body.contains(lastFocused)) lastFocused.focus();
    }

    closeModalBtn.addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && closetModal.style.display === 'block') closeModal();
    });

    /* ---------- start ---------- */

    async function initCloset() {
        currentUser = await getSignedInUser();
        if (!currentUser) {
            document.getElementById('closet-login-prompt').hidden = false;
            return;
        }
        closetPage.hidden = false;
        await loadCloset();
    }
    initCloset();
</script>
</body>
