<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klozet</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.0"></script>
    <script src="config.js"></script>
    <script src="session.js"></script>
    <style>

        .add-item-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            font-size: 0.833333rem;
            line-height: normal;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            display: inline-block;
        }
        .closet-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .sort-control {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">KLOZET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display: none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <div>
        <h2>klozet</h2>
    </div>


    <div id="closet-login-prompt" style="text-align:center; padding: 4rem 2rem; color: #666" hidden>
        <p>Log in to use klozet</p>
        <a href="auth.html?redirect=closet.html" class="add-item-btn">log in</a>
    </div>

    <div id="closet-page" hidden>

    <div class= "closet-toolbar">

        <a href="add_item.html" class="add-item-btn">add item</a>

        <div class="sort-control">
            <button>all</button>
            <button>bottoms</button>
            <button>tops</button>
            <button>shoes</button>
            <button>accessories</button>
            <button>outwear</button>
            <button>other</button>
        </div>
    </div>

    <div class="gallery" id="closet-gallery">
        <!--closet loaded here-->
    </div>

    <p id="status"></p>

    <div id="empty-state" style="display:block; text-align:center; padding: 4rem 2rem; color: #666">
        <p>No items in klozet</p>
        <a href="add_item.html" class="add-item-btn">add item</a>
    </div>

    <div class="modal" id="closet-modal" style="display: none;">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-content" id="modal-content">
            <button class="modal-close" id="close-modal-btn">exit</button>
            <div id="modal-body">
                <p style="text-align: center; padding: 3rem; color:#666"></p>
            </div>

        </div>

    </div>

    </div>

</body>

<script>
    const closetGallery = document.getElementById("closet-gallery");
    const closetModal = document.getElementById("closet-modal");
    const statusEl = document.getElementById("status");
    const emptyState = document.getElementById("empty-state");
    const modalBody = document.getElementById("modal-body");
    const closeModalBtn = document.getElementById('close-modal-btn');

    const closet_items = new Map();
    let allCloset = [];
    let currentSort = 'all';
    const sortControls = document.querySelectorAll(".sort-control button");

    async function loadCloset() {

        closetGallery.style.display = 'none';
        emptyState.style.display = 'none';
        statusEl.textContent = 'loading';
        
        const {data, error} = await supabaseClient.from('clothing_items').select('*').eq('user_id', currentUser.id);

        if(error) {
            console.log(error)
            statusEl.textContent = 'Error Loading Closet';
            return;
        }

        statusEl.textContent = '';

        if(data.length==0){
            emptyState.style.display = 'block';
            return;
        }

        allCloset = data;


        renderCloset('all');
        
    }

    function renderCloset(sortBy) {
        const category = String(sortBy || 'all').trim().toLowerCase();
        currentSort = category;
        const sorted = category === 'all'
            ? [...allCloset]
            : allCloset.filter(item => String(item.category || '').trim().toLowerCase() === category);

        closet_items.clear();

        const fragment = document.createDocumentFragment();

        sorted.forEach(clothing_items =>{
            closet_items.set(String(clothing_items.id), clothing_items);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = clothing_items.id;

            const img = document.createElement('img');
            img.src = clothing_items.img_url;
            img.alt = clothing_items.title;
            img.loading = 'lazy';

            const h3 = document.createElement('h3');
            h3.textContent = clothing_items.title;

            const body = document.createElement('div');
            body.className = 'card-body';

            const header = document.createElement('div');
            header.className = 'card-header';

            const cta = document.createElement('span');
            cta.className = 'card-cta';
            cta.textContent = 'view';

            const brand = document.createElement('span');
            brand.className = 'card-author';
            brand.textContent = `brand: ${clothing_items.brand}`;

            header.append(h3, brand);
            body.append(header, cta);
            card.append(img, body);
            fragment.appendChild(card);


        });

        closetGallery.replaceChildren(fragment);
        closetGallery.style.display = 'grid';
        statusEl.textContent = sorted.length ? '' : `No ${category} items in your closet.`;

    }

    sortControls.forEach(button => {
        button.addEventListener('click', () => renderCloset(button.textContent));
    });

    const CATEGORY_OPTIONS = [
        { value: 'bottoms', label: 'Bottoms' },
        { value: 'tops', label: 'Tops' },
        { value: 'shoes', label: 'Shoes' },
        { value: 'accessories', label: 'Accessories' },
        { value: 'outwear', label: 'Outwear' },
        { value: 'other', label: 'Other' },
    ];

    function buildEditForm(item) {
        const form = document.createElement('form');
        form.className = 'modal-caption modal-edit-form';

        const addField = (labelText, control) => {
            const fieldLabel = document.createElement('label');
            fieldLabel.className = 'modal-meta-label';
            fieldLabel.textContent = labelText;
            fieldLabel.appendChild(control);
            form.appendChild(fieldLabel);
        };

        const makeInput = (name, value, { required = false, maxLength = 150 } = {}) => {
            const input = document.createElement('input');
            input.type = 'text';
            input.name = name;
            input.value = value || '';
            input.required = required;
            input.maxLength = maxLength;
            return input;
        };

        addField('Title', makeInput('title', item.title, { required: true }));

        const categorySelect = document.createElement('select');
        categorySelect.name = 'category';
        categorySelect.required = true;
        CATEGORY_OPTIONS.forEach(({ value, label }) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            categorySelect.appendChild(option);
        });
        categorySelect.value = String(item.category || '').trim().toLowerCase() || 'other';
        addField('Category', categorySelect);

        addField('Brand', makeInput('brand', item.brand, { required: true }));
        addField('Size', makeInput('size', item.size, { required: true }));
        addField('Price', makeInput('price', item.price, { required: false }));
        addField('Material', makeInput('material', item.material));

        const description = document.createElement('textarea');
        description.name = 'description';
        description.maxLength = 500;
        description.value = item.description || '';
        addField('Description', description);

        return form;
    }

    let lastFocusedCard = null;
    function openModal(closetId, card) {
        const clothing_item = closet_items.get(String(closetId))
            ?? allCloset.find(item => String(item.id) === String(closetId));
        if (!clothing_item) return;

        lastFocusedCard = card;

        const layout = document.createElement('div');
        layout.className = 'modal-layout';

        const media = document.createElement('div');
        media.className = 'modal-media';
        const img = document.createElement('img');
        img.src = clothing_item.img_url;
        img.alt = clothing_item.title;
        media.appendChild(img);

        const copy = document.createElement('div');
        copy.className = 'modal-copy';

        const label = document.createElement('span');
        label.className = 'modal-label';
        label.textContent = 'Clothing item';

        const title = document.createElement('h3');
        title.textContent = clothing_item.title;

        const caption = document.createElement('div');
        caption.className = 'modal-caption';

        const brandLabel = document.createElement('span');
        brandLabel.className = 'modal-meta-label';
        brandLabel.textContent = 'Brand';
    
        const brandValue = document.createElement('span');
        brandValue.textContent = clothing_item.brand || 'Unknown';
        caption.append(brandLabel, brandValue);




        if (clothing_item.size) {
            const sizeLabel = document.createElement('span');
            sizeLabel.className = 'modal-meta-label';
            sizeLabel.textContent = 'Size';
            const sizeValue = document.createElement('span');
            sizeValue.textContent = clothing_item.size;
            caption.append(sizeLabel, sizeValue);
        }

        if (clothing_item.price) {
            const priceLabel = document.createElement('span');
            priceLabel.className = 'modal-meta-label';
            priceLabel.textContent = 'Price';
            const priceValue = document.createElement('span');
            priceValue.textContent = `$${parseFloat(clothing_item.price).toFixed(2)}`;
            caption.append(priceLabel, priceValue);
        }

        if (clothing_item.material) {
            const materialLabel = document.createElement('span');
            materialLabel.className = 'modal-meta-label';
            materialLabel.textContent = 'Material';
            const materialValue = document.createElement('span');
            materialValue.textContent = clothing_item.material;
            caption.append(materialLabel, materialValue);
        }

        if (clothing_item.description) {
            const descriptionLabel = document.createElement('span');
            descriptionLabel.className = 'modal-meta-label';
            descriptionLabel.textContent = 'Description';
            const descriptionValue = document.createElement('p');
            descriptionValue.className = 'modal-description';
            descriptionValue.textContent = clothing_item.description;
            caption.append(descriptionLabel, descriptionValue);
        }

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'modal-edit';
        editButton.dataset.closetId = String(clothing_item.id);
        editButton.textContent = 'Edit';
        let editForm = null;
        editButton.addEventListener('click', () => {
            if (editForm) return;
            editForm = buildEditForm(clothing_item);
            editForm.addEventListener('submit', (event) => {
                event.preventDefault();
                saveEdit();
            });
            caption.replaceWith(editForm, editError);
            label.textContent = 'Editing item';
            editButton.replaceWith(saveButton);
            deleteButton.replaceWith(cancelButton);
            editForm.querySelector('input[name="title"]').focus();
        });

        const editError = document.createElement('p');
        editError.className = 'modal-error';
        editError.setAttribute('role', 'alert');

        const saveButton = document.createElement('button');
        saveButton.type = 'button';
        saveButton.className = 'modal-save';
        saveButton.textContent = 'Save';
        saveButton.addEventListener('click', () => saveEdit());

        async function saveEdit() {
            if (saveButton.disabled) return;
            if (!editForm.reportValidity()) return;

            const formValues = Object.fromEntries(new FormData(editForm));
            const updates = {
                title: formValues.title.trim(),
                category: formValues.category,
                brand: formValues.brand.trim(),
                size: formValues.size.trim(),
                description: formValues.description.trim(),
                price: parseFloat(formValues.price) || 0,
                material: formValues.material.trim() || null
            };

            if (!updates.title || !updates.brand || !updates.size) {
                editError.textContent = 'Title, brand and size cannot be blank.';
                return;
            }

            saveButton.disabled = true;
            cancelButton.disabled = true;
            saveButton.textContent = 'Saving...';
            editError.textContent = '';

            const { data, error } = await supabaseClient
                .from('clothing_items')
                .update(updates)
                .eq('id', clothing_item.id)
                .eq('user_id', currentUser.id)
                .select()
                .single();

            if (error) {
                console.error('Error updating item:', error);
                editError.textContent = 'There was an error saving your changes. Please try again.';
                saveButton.disabled = false;
                cancelButton.disabled = false;
                saveButton.textContent = 'Save';
                return;
            }

            Object.assign(clothing_item, data);
            renderCloset(currentSort);
            const newCard = closetGallery.querySelector(`.card[data-id="${CSS.escape(String(clothing_item.id))}"]`);
            openModal(clothing_item.id, newCard || lastFocusedCard);
        }

        const cancelButton = document.createElement('button');
        cancelButton.type = 'button';
        cancelButton.className = 'modal-cancel';
        cancelButton.textContent = 'Cancel';
        cancelButton.addEventListener('click', () => {
            openModal(clothing_item.id, lastFocusedCard);
        });

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'modal-delete';
        deleteButton.dataset.closetId = String(clothing_item.id);
        deleteButton.textContent = 'Delete';
        deleteButton.addEventListener('click', () => {});

        const actions = document.createElement('div');
        actions.className = 'modal-actions';
        actions.append(editButton, deleteButton);

        copy.append(label, title, caption, actions);
        layout.append(media, copy);
        modalBody.replaceChildren(layout);
        closetModal.style.display = 'block';
        document.body.style.overflow = 'hidden';

    }

    function closeModal() {
        closetModal.style.display = 'none';
        modalBody.replaceChildren();
        document.body.style.overflow = '';
        lastFocusedCard?.focus();
    }

    closeModalBtn.addEventListener('click', closeModal);
    document.querySelector('#closet-modal .modal-backdrop').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && closetModal.style.display === 'block') closeModal();
    });


    closetGallery.addEventListener('click', (event) => {
        const card = event.target.closest('.card');
        if (card) openModal(card.dataset.id, card);
    });

    let currentUser = null;
    async function initCloset() {
        currentUser = await getSignedInUser();
        if (!currentUser) {
            document.getElementById('closet-login-prompt').hidden = false;
            return;
        }
        document.getElementById('closet-page').hidden = false;
        await loadCloset();
    }
    initCloset();




</script>






</html>
