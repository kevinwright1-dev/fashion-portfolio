<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the closet - Fashion Closet</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .closet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .add-item-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }

        .add-item-btn:hover {
            background: #222;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 0.5rem 1rem;
            cursor: pointer;
            text-transform: lowercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .filter-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .filter-btn:hover {
            border-color: #999;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-state p {
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="fits.html">FIT</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <div class="closet-header">
        <h1>closet:</h1>
        <a href="add_item.html" class="add-item-btn" id="add-item-btn" style="display:none;">+ add item</a>
    </div>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="tops">Tops</button>
        <button class="filter-btn" data-category="bottoms">Bottoms</button>
        <button class="filter-btn" data-category="shoes">Shoes</button>
        <button class="filter-btn" data-category="accessories">Accessories</button>
        <button class="filter-btn" data-category="outerwear">Outerwear</button>
        <button class="filter-btn" data-category="other">Other</button>
        <input
            type="search"
            id="closet-search"
            placeholder="search item or brand..."
            style="margin-left:auto; min-width:240px; max-width:360px;"
        >
    </div>

    <div id="loading" style="text-align: center; padding: 2rem; color: #666;">
        Loading closet...
    </div>

    <div class="gallery" id="items-gallery" style="display: none;">
        <!-- Items will be loaded here -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <p>your closet is empty</p>
        <a href="add_item.html" class="add-item-btn">add your first item</a>
    </div>

    <div id="item-modal" class="modal" style="display:none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-label="Closet item details">
            <button class="modal-close" type="button" onclick="closeModal()" aria-label="Close item details">exit</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null;
        let allItems = [];
        let currentFilter = 'all';

        // Initialize
        init();

        document.querySelector('#item-modal .modal-backdrop').addEventListener('click', closeModal);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && document.getElementById('item-modal').style.display === 'block') {
                closeModal();
            }
        });

        async function init() {
            // Check auth
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                currentUser = session.user;
                document.getElementById('profile-link').style.display = 'inline';
                document.getElementById('add-item-btn').style.display = 'inline-block';
                document.getElementById('auth-link').style.display = 'none';
            }

            // Load items
            await loadItems();

            // Setup filter buttons
            setupFilters();
            document.getElementById('closet-search').addEventListener('input', applyFilters);
        }

        async function loadItems() {
            try {
                let query = supabaseClient
                    .from('clothing_items')
                    .select('*')
                    .order('created_at', { ascending: false });

                // If user is logged in, show only their items
                // Otherwise show all public items
                if (currentUser) {
                    query = query.eq('user_id', currentUser.id);
                }

                const { data, error } = await query;

                if (error) throw error;

                allItems = data || [];
                displayItems(allItems);

                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('loading').textContent = 'Error loading items';
            }
        }

        function displayItems(items) {
            const gallery = document.getElementById('items-gallery');
            const emptyState = document.getElementById('empty-state');

            if (items.length === 0) {
                gallery.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            gallery.style.display = 'grid';
            emptyState.style.display = 'none';

            gallery.innerHTML = items.map(item => `
                <div class="gallery-item" data-category="${item.category}">
                    <img src="${item.image_url}" alt="${item.title}" onclick="viewItem('${item.id}')">
                    <p><strong>${item.title}</strong></p>
                    ${item.brand ? `<p style="font-size: 0.8rem; color: #666;">${item.brand}</p>` : ''}
                    <p style="font-size: 0.75rem; color: #999; text-transform: uppercase;">${item.category}</p>
                </div>
            `).join('');
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Update active state
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // Filter items
                    currentFilter = this.dataset.category;
                    applyFilters();
                });
            });
        }

        function applyFilters() {
            const searchText = document.getElementById('closet-search').value.trim().toLowerCase();

            const filtered = allItems.filter((item) => {
                const categoryPass = currentFilter === 'all' || item.category === currentFilter;
                const title = (item.title || '').toLowerCase();
                const brand = (item.brand || '').toLowerCase();
                const searchPass = !searchText || title.includes(searchText) || brand.includes(searchText);
                return categoryPass && searchPass;
            });

            displayItems(filtered);
        }

        function viewItem(itemId) {
            const item = allItems.find((closetItem) => String(closetItem.id) === String(itemId));
            if (!item) return;

            const modalBody = document.getElementById('modal-body');
            const image = document.createElement('img');
            image.className = 'closet-modal-image';
            image.src = item.image_url;
            image.alt = item.title || 'Closet item';

            const details = document.createElement('div');
            details.className = 'closet-modal-copy';

            const title = document.createElement('h2');
            title.textContent = item.title || 'Untitled item';
            details.append(title);

            if (item.brand) {
                const brand = document.createElement('p');
                brand.textContent = item.brand;
                details.append(brand);
            }

            if (item.category) {
                const category = document.createElement('p');
                category.textContent = item.category;
                details.append(category);
            }

            modalBody.replaceChildren(image, details);
            document.getElementById('item-modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('item-modal').style.display = 'none';
            document.getElementById('modal-body').replaceChildren();
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
