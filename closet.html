<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closet</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2.45.0"></script>
    <script src="config.js"></script>
    <style>

        .add-item-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.7rem 2rem;
            font-size: 0.833333rem;
            line-height: normal;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            font-family: "Roboto Mono", monospace;
            text-decoration: none;
            display: inline-block;
        }
        .closet-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .sort-control {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="closet.html">CLOSET</a>
        <a href="outfits.html">OUTFITS</a>
        <a href="inspo.html">INSPO</a>
        <a href="forum.html">FORUM</a>
        <a href="profile.html" id="profile-link" style="display:none;">PROFILE</a>
        <a href="auth.html" id="auth-link">LOGIN</a>
    </nav>

    <div>
        <h2>Closet</h2>
    </div>


    <div class= "closet-toolbar">

        <a href="add_item.html" class="add-item-btn">add item</a>

        <div class="sort-control"> 
            <button>all</button>
            <button>bottoms</button>
            <button>tops</button>
            <button>shoes</button>
            <button>accessories</button>
            <button>outwear</button>
            <button>other</button>
        </div>
    </div>

    <div class="gallery" id="closet-gallery">
        <!--Closet loaded here-->
    </div>

    <p id="status"></p>

    <div id="empty-state" style="display:block; text-align:center; padding: 4rem 2rem; color: #666">
        <p>No items in closet</p>
        <a href="add_item.html" class="add-item-btn">add item</a>
    </div>

    <div class="modal" id="closet-modal" style="display: none;">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-content" id="modal-content">
            <button class="modal-close" id="close-modal-btn">exit</button>
            <div id="modal-body">
                <p style="text-align: center; padding: 3rem; color:#666"></p>
            </div>

        </div>

    </div>

</body>

<script>
    const closetGallery = document.getElementById("closet-gallery");
    const closetModal = document.getElementById("closet-modal");
    const statusEl = document.getElementById("status");
    const emptyState = document.getElementById("empty-state");
    const modalBody = document.getElementById("modal-body");
    const closeModalBtn = document.getElementById('close-modal-btn');

    const closet_items = new Map();
    let allCloset = [];    
    const sortControls = document.querySelectorAll("#sort.control button");

    async function loadCloset() {

        closetGallery.style.display = 'none';
        emptyState.style.display = 'none';
        statusEl.textContent = 'loading';
        
        const {data, error} = await supabaseClient.from('clothing_items').select('*');

        if(error) {
            console.log(error)
            statusEl.textContent = 'Error Loading Closet';
            return;
        }

        statusEl.textContent = '';

        if(data.length==0){
            emptyState.style.display = 'block';
            return;
        }

        allCloset = data;


        renderCloset('all');
        
    }

    function renderCloset(sortBy) {
        const sorted = [...allCloset]

        closet_items.clear();

        const fragment = document.createDocumentFragment();

        sorted.forEach(clothing_items =>{
            closet_items.set(String(clothing_items.id), clothing_items);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = clothing_items.id;

            const img = document.createElement('img');
            img.src = clothing_items.img_url;
            img.alt = clothing_items.title;
            img.loading = 'lazy';

            const h3 = document.createElement('h3');
            h3.textContent = clothing_items.title;

            const body = document.createElement('div');
            body.className = 'card-body';

            const header = document.createElement('div');
            header.className = 'card-header';

            const cta = document.createElement('span');
            cta.className = 'card-cta';
            cta.textContent = 'view';

            const brand = document.createElement('span');
            brand.className = 'card-author';
            brand.textContent = `brand: ${clothing_items.brand}`;

            header.append(h3, brand);
            body.append(header, cta);
            card.append(img, body);
            fragment.appendChild(card);


        });

        closetGallery.replaceChildren(fragment);
        closetGallery.style.display = 'grid';


    }

    let lastFocusedCard = null;
    function openModal(closetId, card) {
        const clothing_item = closet_items.get(String(closetId));
        if (!clothing_item) return;

        lastFocusedCard = card;

        const layout = document.createElement('div');
        layout.className = 'modal-layout';

        const media = document.createElement('div');
        media.className = 'modal-media';
        const img = document.createElement('img');
        img.src = clothing_item.img_url;
        img.alt = clothing_item.title;
        media.appendChild(img);

        const copy = document.createElement('div');
        copy.className = 'modal-copy';

        const label = document.createElement('span');
        label.className = 'modal-label';
        label.textContent = 'Clothing item';

        const title = document.createElement('h3');
        title.textContent = clothing_item.title;

        const caption = document.createElement('div');
        caption.className = 'modal-caption';

        const brandLabel = document.createElement('span');
        brandLabel.className = 'modal-meta-label';
        brandLabel.textContent = 'Brand';
        const brandValue = document.createElement('span');
        brandValue.textContent = clothing_item.brand || 'Unknown';
        caption.append(brandLabel, brandValue);

        if (clothing_item.size) {
            const sizeLabel = document.createElement('span');
            sizeLabel.className = 'modal-meta-label';
            sizeLabel.textContent = 'Size';
            const sizeValue = document.createElement('span');
            sizeValue.textContent = clothing_item.size;
            caption.append(sizeLabel, sizeValue);
        }

        if (clothing_item.description) {
            const descriptionLabel = document.createElement('span');
            descriptionLabel.className = 'modal-meta-label';
            descriptionLabel.textContent = 'Description';
            const descriptionValue = document.createElement('p');
            descriptionValue.className = 'modal-description';
            descriptionValue.textContent = clothing_item.description;
            caption.append(descriptionLabel, descriptionValue);
        }

        copy.append(label, title, caption);
        layout.append(media, copy);
        modalBody.replaceChildren(layout);
        closetModal.style.display = 'block';
        document.body.style.overflow = 'hidden';

    }

    function closeModal() {
        closetModal.style.display = 'none';
        modalBody.replaceChildren();
        document.body.style.overflow = '';
        lastFocusedCard?.focus();
    }

    closeModalBtn.addEventListener('click', closeModal);
    document.querySelector('#closet-modal .modal-backdrop').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && closetModal.style.display === 'block') closeModal();
    });


    closetGallery.addEventListener('click', (event) => {
        const card = event.target.closest('.card');
        if (card) openModal(card.dataset.id, card);
    });


    loadCloset();

    


</script>






</html>
